<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Switcher Bar, Static</title>
    <!-- A static copy of the bar from skills/prototype/switcher.js for visual editing. Port changes back into switcher.js. -->
    <style>
    :host {
      display: block;
    }

    :host([hidden]),
    .variant[hidden] {
      display: none;
    }

    .variant {
      display: block;
    }

    .end {
      height: 80px;
    }

    :host([data-position="top"]) .variants {
      padding-top: 80px;
    }

    :host([data-position="top"]) .end {
      display: none;
    }

    .ui {
      all: initial;
      /* kit:tokens */
      --gray-1: light-dark(#ffffff, #080808);
      --gray-2: light-dark(#fafafa, #111111);
      --gray-3: light-dark(#f2f2f2, #1a1a1a);
      --gray-4: light-dark(#ebebeb, #222222);
      --gray-5: light-dark(#e3e3e3, #2a2a2a);
      --gray-10: light-dark(#6b6b6b, #8f8f8f);
      --gray-11: light-dark(#575757, #b4b4b4);
      --gray-12: light-dark(#080808, #ffffff);
      --blue: #02bbff;
      --red: light-dark(#d93036, #ff6369);
      --green: light-dark(#2b9a66, #3dd68c);
      --accent: var(--blue);
      --danger: var(--red);
      --success: var(--green);
      --text-primary: var(--gray-12);
      --text-secondary: color-mix(in oklab, var(--gray-12) 80%, var(--gray-11));
      --text-tertiary: var(--gray-11);
      --text-quaternary: var(--gray-10);
      --text-on-accent: light-dark(#ffffff, #080808);
      --border-primary: color-mix(in oklab, var(--gray-12) 7%, transparent);
      --border-secondary: color-mix(in oklab, var(--gray-12) 12%, transparent);
      --background-primary: var(--gray-1);
      --background-secondary: var(--gray-2);
      --background-tertiary: light-dark(rgb(8 8 8 / 5%), rgb(255 255 255 / 8%));
      --background-hover: light-dark(rgb(8 8 8 / 8%), rgb(255 255 255 / 13%));
      --background-raised: light-dark(#ffffff, #1a1a1a);
      --background-control: light-dark(#ffffff, #222222);
      --background-overlay: light-dark(#ffffff, #111111);
      --fill-hover: light-dark(rgb(8 8 8 / 4%), rgb(255 255 255 / 6%));
      --shadow-border: 0 0 0 1px light-dark(rgb(0 0 0 / 7%), rgb(255 255 255 / 7%));
      --shadow-default:
        inset 0 0 0 0.5px light-dark(transparent, rgb(255 255 255 / 7%)),
        0 0 0 0.5px light-dark(rgb(0 0 0 / 6%), transparent),
        0 1px 1px -1px light-dark(rgb(0 0 0 / 10%), transparent),
        0 1px 2px 0 light-dark(rgb(0 0 0 / 5%), transparent);
      --shadow-large:
        0 0 0 0.5px light-dark(oklab(0.802 0 0 / 0.297), transparent),
        0 0 0 1px light-dark(transparent, oklab(0.463 0 0 / 0.303)),
        0 2px 3px -2px light-dark(rgb(0 0 0 / 6.3%), rgb(0 0 0 / 15%)),
        0 3px 12px -4px light-dark(rgb(0 0 0 / 10%), transparent),
        0 4px 16px -8px light-dark(rgb(0 0 0 / 5%), transparent),
        0 3px 8px -2px light-dark(transparent, rgb(0 0 0 / 40%)),
        0 4px 12px -4px light-dark(transparent, rgb(0 0 0 / 50%));
      --shadow-extra-large:
        inset 0 0 0 0.5px light-dark(transparent, rgb(255 255 255 / 7%)),
        0 0 0 0.5px light-dark(rgb(0 0 0 / 6%), transparent),
        0 8px 40px 0 rgb(0 0 0 / 5%),
        0 12px 32px -16px rgb(0 0 0 / 15%);
      --font-sans: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
      --font-weight-400: "wght" 400, "opsz" 14;
      --font-weight-500: "wght" 500, "opsz" 14;
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
      --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
      --duration-snappy: 220ms;
      --duration-exit: 160ms;
      --radius-control: 8px;
      --radius-menu: 12px;
      --radius-panel: 16px;
      /* kit:tokens end */
      --neutral-50: light-dark(rgb(0 0 0 / 0.03), rgb(255 255 255 / 0.03));
      --neutral-100: light-dark(rgb(0 0 0 / 0.07), rgb(255 255 255 / 0.07));
      --neutral-150: light-dark(rgb(0 0 0 / 0.11), rgb(255 255 255 / 0.11));
      --accent: light-dark(#2f3037, #ffffff);
      --text-primary: light-dark(#212126, #ffffff);
      --text-secondary: light-dark(rgb(0 0 0 / 0.62), rgb(255 255 255 / 0.62));
      --text-tertiary: light-dark(rgb(33 33 38 / 0.65), rgb(255 255 255 / 0.65));
      --text-quaternary: light-dark(rgb(0 0 0 / 0.41), rgb(255 255 255 / 0.41));
      --border-primary: var(--neutral-100);
      --border-secondary: var(--neutral-150);
      --background-raised: light-dark(#ffffff, #212126);
      --background-overlay: var(--background-raised);
      --background-tertiary: var(--neutral-50);
      --background-hover: var(--neutral-100);
      --shadow-ring: 0 0 0 1px var(--neutral-100);
      --shadow-bar: var(--shadow-ring), 0 2px 4px -1px rgb(0 0 0 / 0.06), 0 6px 16px -4px rgb(0 0 0 / 0.08);
      --shadow-large: var(--shadow-ring), 0 5px 15px 0 rgb(0 0 0 / 0.08), 0 15px 35px -5px rgb(0 0 0 / 0.2);
      --shadow-extra-large: var(--shadow-large);
      --font-sans: ui-sans-serif, system-ui, sans-serif;
      --radius-control: 6px;
      --radius-panel: 12px;
      --radius-kbd: 4px;
      color-scheme: inherit;
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 18px;
      font-variation-settings: var(--font-weight-400);
      font-optical-sizing: none;
      font-feature-settings: "calt", "ccmp", "locl", "kern", "cv01", "ss03";
      -webkit-font-smoothing: antialiased;
      color: var(--text-primary);
    }

    .ui,
    .ui *,
    .ui *::before,
    .ui *::after {
      box-sizing: border-box;
    }

    :where(.ui) * {
      padding: 0;
      margin: 0;
      font: inherit;
      font-variation-settings: inherit;
      color: inherit;
      border: 0;
    }

    :where(.ui) svg {
      display: block;
    }

    :where(.ui) button {
      cursor: pointer;
      user-select: none;
      background: none;
    }

    .ui :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .note {
      color: var(--text-tertiary);
    }

    /* kit:fade */
    @property --fade-start {
      syntax: "<length>";
      inherits: false;
      initial-value: 0px;
    }

    @property --fade-end {
      syntax: "<length>";
      inherits: false;
      initial-value: 0px;
    }

    @keyframes scroll-fade {
      0% {
        --fade-start: 0px;
        --fade-end: 24px;
      }
      10% {
        --fade-start: 24px;
      }
      90% {
        --fade-end: 24px;
      }
      100% {
        --fade-start: 24px;
        --fade-end: 0px;
      }
    }

    .scroll-fade {
      mask-image:
        linear-gradient(
          to bottom,
          transparent,
          rgb(0 0 0 / 0.36) calc(var(--fade-start) * 5 / 24),
          rgb(0 0 0 / 0.64) calc(var(--fade-start) * 10 / 24),
          rgb(0 0 0 / 0.84) calc(var(--fade-start) * 14 / 24),
          rgb(0 0 0 / 0.96) calc(var(--fade-start) * 19 / 24),
          black var(--fade-start),
          black calc(100% - var(--fade-end)),
          rgb(0 0 0 / 0.96) calc(100% - var(--fade-end) * 19 / 24),
          rgb(0 0 0 / 0.84) calc(100% - var(--fade-end) * 14 / 24),
          rgb(0 0 0 / 0.64) calc(100% - var(--fade-end) * 10 / 24),
          rgb(0 0 0 / 0.36) calc(100% - var(--fade-end) * 5 / 24),
          transparent
        ),
        linear-gradient(black, black),
        linear-gradient(black, black);
      mask-clip: border-box, border-box, no-clip;
      mask-size: 100% 100%, 100% 100%, calc(100% + 128px) calc(100% + 128px);
      mask-position: 0 0, 0 0, -64px -64px;
      mask-repeat: no-repeat;
      mask-composite: add, exclude;
      animation: scroll-fade linear both;
      animation-timeline: scroll(self);
    }
    /* kit:fade end */

    /* kit:controls */
    .chip,
    .action {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      height: 28px;
      padding: 0 12px;
      font-size: 13px;
      font-variation-settings: var(--font-weight-500);
      color: var(--text-tertiary);
      white-space: nowrap;
      border-radius: var(--radius-control);

      &[aria-pressed="true"] {
        color: var(--text-primary);
        background: var(--background-tertiary);
      }

      &:active:not(:disabled) {
        color: var(--text-primary);
      }

      &:disabled {
        cursor: default;
        opacity: 0.5;
      }
    }

    .action {
      color: var(--text-primary);
      background: var(--background-tertiary);

      &:active:not(:disabled) {
        background: var(--background-hover);
      }
    }

    .icon-button,
    .tool-button {
      position: relative;
      display: grid;
      flex: none;
      place-items: center;
      width: 28px;
      height: 28px;
      color: var(--text-tertiary);
      border-radius: var(--radius-control);

      &::before {
        position: absolute;
        inset: -4px;
        content: "";
      }

      &:disabled {
        cursor: default;
        opacity: 0.4;
      }
    }

    .icon-button {
      background: var(--background-tertiary);

      &:active:not(:disabled, [aria-pressed="true"]) {
        color: var(--text-primary);
        background: var(--background-hover);
      }

      &[aria-pressed="true"] {
        color: var(--text-on-accent);
        background: var(--accent);
      }
    }

    .tool-button {
      &:active:not(:disabled) {
        color: var(--text-primary);
        background: var(--background-tertiary);
      }

      &[aria-pressed="true"] {
        color: var(--text-primary);
        background: var(--background-tertiary);
      }

      &[aria-pressed="true"]:active:not(:disabled) {
        background: var(--background-hover);
      }
    }

    .pick {
      position: relative;
      display: grid;
      flex: none;
      place-items: center;
      width: 28px;
      height: 28px;
      color: var(--text-quaternary);
      border-radius: var(--radius-control);
      box-shadow: inset 0 0 0 1px var(--border-secondary);

      &::before {
        position: absolute;
        inset: -6px;
        content: "";
      }

      &:active:not([aria-pressed="true"]) {
        color: var(--text-primary);
      }

      &[aria-pressed="true"] {
        color: var(--text-on-accent);
        background: var(--accent);
        box-shadow: none;
      }
    }

    .count {
      color: var(--text-quaternary);
      font-variant-numeric: tabular-nums;
    }

    @media (hover: hover) and (pointer: fine) {
      .chip:hover:not(:disabled) {
        color: var(--text-primary);
      }

      .action:hover:not(:disabled) {
        background: var(--background-hover);
      }

      .icon-button:hover:not(:disabled, [aria-pressed="true"]) {
        color: var(--text-primary);
        background: var(--background-hover);
      }

      .tool-button:hover:not(:disabled) {
        color: var(--text-primary);
        background: var(--background-tertiary);
      }

      .tool-button[aria-pressed="true"]:hover:not(:disabled) {
        background: var(--background-hover);
      }

      .pick:hover:not([aria-pressed="true"]) {
        color: var(--text-primary);
      }
    }
    /* kit:controls end */

    /* kit:overlays */
    .toast {
      position: fixed;
      inset: auto;
      display: inline-flex;
      align-items: center;
      height: 32px;
      padding: 0 12px;
      margin: 0;
      overflow: visible;
      font-size: 13px;
      font-variation-settings: var(--font-weight-500);
      color: var(--text-primary);
      white-space: nowrap;
      pointer-events: none;
      background: var(--background-raised);
      border: 1px solid transparent;
      border-radius: 10px;
      box-shadow: var(--shadow-large);
      opacity: 0;
      translate: -50% 4px;
      scale: 0.97;
      transform-origin: bottom center;
      transition:
        opacity var(--duration-exit) var(--ease-out),
        translate var(--duration-exit) var(--ease-out),
        scale var(--duration-exit) var(--ease-out);

      &[data-side="below"] {
        translate: -50% -4px;
        transform-origin: top center;
      }

      &[data-open] {
        opacity: 1;
        translate: -50% 0;
        scale: 1;
        transition-duration: var(--duration-snappy);
      }

      &:has(button) {
        gap: 12px;
        padding-right: 4px;
        pointer-events: auto;
      }

      button {
        height: 24px;
        padding: 0 8px;
        color: var(--accent);
        border-radius: 6px;

        &:active {
          background: var(--background-hover);
        }
      }
    }

    .tip {
      position: fixed;
      inset: auto;
      display: inline-flex;
      gap: 6px;
      align-items: center;
      height: 24px;
      padding: 0 8px;
      margin: 0;
      overflow: visible;
      font-size: 12px;
      font-variation-settings: var(--font-weight-500);
      color: var(--text-primary);
      white-space: nowrap;
      pointer-events: none;
      background: var(--background-raised);
      border: 1px solid transparent;
      border-radius: var(--radius-control);
      box-shadow: var(--shadow-large);
      translate: -50% 0;
      transition:
        opacity 125ms var(--ease-out),
        translate 125ms var(--ease-out);

      @starting-style {
        opacity: 0;
        translate: -50% 4px;
      }

      &[data-side="below"] {
        @starting-style {
          translate: -50% -4px;
        }
      }

      &[data-instant] {
        transition: none;
      }

      &:not(:popover-open) {
        display: none;
      }

      kbd {
        font: inherit;
        color: var(--text-tertiary);
      }
    }

    @media (hover: hover) and (pointer: fine) {
      .toast button:hover {
        background: var(--background-hover);
      }
    }
    /* kit:overlays end */

    .bar {
      --spring: linear(0, 0.2414, 0.6338, 0.9173, 1.0476, 1.0726, 1.0514, 1.0231, 1.0041, 0.9959, 0.9948, 0.9966, 0.9986, 0.9998, 1);
      position: fixed;
      inset: auto 0 calc(16px + env(safe-area-inset-bottom));
      display: none;
      gap: 2px;
      align-items: center;
      width: max-content;
      max-width: calc(100vw - 32px);
      height: 40px;
      padding: 4px;
      margin: 0 auto;
      overflow: visible;
      background: var(--background-raised);
      border: 0;
      border-radius: 999px;
      box-shadow: var(--shadow-bar);
      opacity: 0;
      translate: 0 12px;
      scale: 0.9;
      transform-origin: bottom center;
      transition:
        opacity var(--duration-exit) var(--ease-out),
        translate var(--duration-exit) var(--ease-out),
        scale var(--duration-exit) var(--ease-out),
        display var(--duration-exit) allow-discrete,
        overlay var(--duration-exit) allow-discrete;

      &:popover-open {
        display: flex;
        opacity: 1;
        translate: 0;
        scale: 1;
        transition:
          opacity var(--duration-snappy) var(--ease-out),
          translate 450ms var(--spring),
          scale 450ms var(--spring);

        @starting-style {
          opacity: 0;
          translate: 0 12px;
          scale: 0.9;
        }
      }
    }

    :host([data-position="top"]) .bar {
      inset: calc(16px + env(safe-area-inset-top)) 0 auto;
      transform-origin: top center;
    }

    :host([data-position="top"]) .bar:not(:popover-open) {
      translate: 0 -12px;
    }

    @starting-style {
      :host([data-position="top"]) .bar:popover-open {
        translate: 0 -12px;
      }
    }

    .divider {
      flex: none;
      width: 1px;
      height: 16px;
      margin: 0 4px;
      background: var(--border-secondary);
    }

    .bar :is(.current, .tool-button) {
      border-radius: 999px;
      transition:
        background-color 150ms var(--ease-out),
        color 150ms var(--ease-out),
        scale 120ms var(--ease-out);

      &:focus-visible {
        outline-color: color-mix(in oklab, var(--accent) 60%, var(--background-raised));
        outline-offset: -2px;
      }
    }

    .tipped.find {
      flex: 0 1 auto;
      min-width: 0;
    }

    .current {
      min-width: 0;
      max-width: 280px;
      height: 32px;
      padding: 0 12px 0 10px;
      overflow: hidden;
      color: var(--text-primary);
      background: var(--background-raised);

      svg {
        flex: none;
        color: var(--text-quaternary);
      }

      .count {
        flex: none;
        color: var(--text-tertiary);
      }

      &:active:not(:disabled) {
        background: var(--neutral-50);
        scale: 0.97;
      }
    }

    @media (hover: hover) and (pointer: fine) {
      .current:hover {
        background: var(--neutral-50);
      }
    }

    .current-label {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tool-button {
      width: 32px;
      height: 32px;
      color: var(--text-secondary);

      &:active {
        scale: 0.92;
      }
    }

    .keep {
      --mark: var(--success);
    }

    .drop {
      --mark: var(--danger);
    }

    .bar :is(.keep, .drop)[aria-pressed="true"] {
      color: var(--mark);
      background: color-mix(in oklab, var(--mark) 12%, transparent);
    }

    @media (hover: hover) and (pointer: fine) {
      .bar :is(.keep, .drop)[aria-pressed="true"]:hover {
        background: color-mix(in oklab, var(--mark) 18%, transparent);
      }
    }

    .tipped {
      position: relative;
      display: flex;
      flex: none;
    }

    .hint {
      position: absolute;
      bottom: calc(100% + 14px);
      left: 50%;
      display: inline-flex;
      gap: 6px;
      align-items: center;
      height: 26px;
      padding: 0 4px 0 8px;
      white-space: nowrap;
      pointer-events: none;
      color: #ffffff;
      background: #000000;
      border-radius: var(--radius-control);
      box-shadow: 0 0 0 1px light-dark(transparent, rgb(255 255 255 / 0.12));
      opacity: 0;
      translate: -50% 4px;
      transition:
        opacity 125ms var(--ease-out),
        translate 125ms var(--ease-out);

      kbd {
        min-width: 18px;
        padding: 0 5px;
        font-size: 11px;
        line-height: 18px;
        font-variation-settings: var(--font-weight-500);
        color: rgb(255 255 255 / 0.73);
        text-align: center;
        background: rgb(255 255 255 / 0.15);
        border-radius: var(--radius-kbd);
      }
    }

    :host([data-position="top"]) .hint {
      top: calc(100% + 14px);
      bottom: auto;
      translate: -50% -4px;
    }

    @media (hover: hover) and (pointer: fine) {
      .tipped:hover .hint {
        opacity: 1;
        translate: -50% 0;
        transition-delay: 500ms;

        .bar[data-warm] & {
          transition-delay: 0s;
        }
      }
    }

    .tipped:has(:focus-visible) .hint {
      opacity: 1;
      translate: -50% 0;
      transition-delay: 0s;
    }

    .hint[data-show] {
      padding-inline: 8px;
      opacity: 1;
      translate: -50% 0;
      transition-delay: 0s;

      kbd {
        display: none;
      }
    }

    .bar[data-noting] .hint {
      opacity: 0 !important;
    }

    .bar[data-noting] .note-toggle {
      color: var(--text-primary);
      background: var(--neutral-50);
    }

    .note-toggle[data-filled]::after {
      position: absolute;
      right: 8px;
      bottom: 8px;
      width: 5px;
      height: 5px;
      content: "";
      background: currentColor;
      border-radius: 50%;
      box-shadow: 0 0 0 1.5px var(--background-raised);
    }

    .note-panel {
      position: fixed;
      inset: auto;
      gap: 4px;
      max-width: calc(100vw - 16px);
      padding: 12px 16px 14px;
      margin: 0;
      overflow: visible;
      color: var(--text-primary);
      background: var(--background-raised);
      border-radius: var(--radius-panel);
      box-shadow:
        var(--shadow-ring),
        0 1px 2px rgb(0 0 0 / 0.04),
        0 4px 10px -4px rgb(0 0 0 / 0.06);
      opacity: 0;
      translate: -50% 4px;
      scale: 0.97;
      transform-origin: bottom center;
      transition:
        opacity 120ms var(--ease-out),
        translate 120ms var(--ease-out),
        scale 120ms var(--ease-out),
        display 120ms allow-discrete,
        overlay 120ms allow-discrete;

      &[data-below] {
        translate: -50% -4px;
        transform-origin: top center;
      }

      &:popover-open {
        display: grid;
        opacity: 1;
        translate: -50% 0;
        scale: 1;
        transition-duration: 200ms;

        @starting-style {
          opacity: 0;
          translate: -50% 4px;
          scale: 0.97;
        }
      }

      &[data-below]:popover-open {
        @starting-style {
          translate: -50% -4px;
        }
      }

      &:not(:popover-open) {
        display: none;
      }
    }

    .note-label {
      font-size: 12px;
      line-height: 16px;
      color: var(--text-tertiary);
    }

    .note-field {
      width: 100%;
      min-height: 40px;
      max-height: 160px;
      line-height: 20px;
      resize: none;
      field-sizing: content;
      background: none;

      &::placeholder {
        color: var(--text-quaternary);
      }

      &:focus-visible {
        outline: none;
      }

      @media (forced-colors: active) {
        &:focus-visible {
          outline: 2px solid CanvasText;
          outline-offset: 4px;
        }
      }
    }

    .status {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    .option-title {
      font-variation-settings: var(--font-weight-500);
    }

    .palette {
      width: min(544px, calc(100vw - 40px));
      max-width: none;

      &::before {
        width: 6px;
        height: 6px;
        content: "";

      }
