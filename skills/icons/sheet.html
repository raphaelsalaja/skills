        if (!by) return slot;
        const previous = slot.segs[by - 1];
        return { start: [previous[4], previous[5]], segs: [...slot.segs.slice(by), ...slot.segs.slice(0, by)], closed: true };
      }

      const collapsed = (point, count) => ({ start: point.slice(), segs: Array.from({ length: count }, () => [...point, ...point, ...point]), closed: false });

      function travelOf(a, b) {
        const from = anchorsOf(a);
        const to = anchorsOf(b);
        return from.reduce((sum, [x, y], index) => sum + Math.hypot(to[index][0] - x, to[index][1] - y), 0) / from.length;
      }

      function nearestAnchor(slots, [x, y]) {
        let best = slots[0].start;
        let distance = Infinity;
        for (const point of slots.flatMap(anchorsOf)) {
          const next = Math.hypot(point[0] - x, point[1] - y);
          if (next < distance) [best, distance] = [point, next];
        }
        return best;
      }

      function convertPair(aMarkup, bMarkup) {
        const a = iconForm(aMarkup);
        const b = iconForm(bMarkup);
        if (a.unsupported.length || b.unsupported.length || !a.slots.length || !b.slots.length) return null;
        const [ax, ay, aw, ah] = a.viewBox;
        const [bx, by, bw, bh] = b.viewBox;
        const fit = ([x, y]) => [ax + ((x - bx) * aw) / bw, ay + ((y - by) * ah) / bh];
        const fitted = b.slots.map((slot) => ({
          start: fit(slot.start),
          segs: slot.segs.map((segment) => [...fit(segment.slice(0, 2)), ...fit(segment.slice(2, 4)), ...fit(segment.slice(4))]),
          closed: slot.closed,
        }));
        const byLength = (slots) => [...slots].sort((one, two) => slotLength(two) - slotLength(one));
        const from = byLength(a.slots);
        const to = byLength(fitted);
        const count = Math.max(from.length, to.length);
        const pairs = [];
        for (let index = 0; index < count; index += 1) {
          const one = from[index];
          const two = to[index];
          const segments = Math.max(one?.segs.length ?? 0, two?.segs.length ?? 0);
          const start = one ? subdivide(one, segments) : collapsed(nearestAnchor(from, centroidOf(two)), segments);
          const base = two ? subdivide(two, segments) : collapsed(nearestAnchor(to, centroidOf(one)), segments);
          const candidates = [base, reversed(base)];
          if (two && isClosed(base)) {
            for (let by = 1; by < segments; by += 1) candidates.push(rotated(base, by), reversed(rotated(base, by)));
          }
          let best = candidates[0];
          for (const candidate of candidates) if (travelOf(start, candidate) < travelOf(start, best)) best = candidate;
          pairs.push([start, best]);
        }
        return {
          from: pairs.map(([one]) => one),
          to: pairs.map(([, two]) => two),
          travel: pairs.reduce((sum, [one, two]) => sum + travelOf(one, two), 0) / pairs.length,
        };
      }

      function slotsD(slots) {
        const f = (value) => +value.toFixed(3);
        return slots.map((slot) => `M${f(slot.start[0])} ${f(slot.start[1])}${slot.segs.map((segment) => `C${segment.map(f).join(" ")}`).join("")}`).join("");
      }

      function lerpSlots(from, to, k) {
        const mix = (a, b) => a + (b - a) * k;
        return from.map((slot, index) => ({
          start: [mix(slot.start[0], to[index].start[0]), mix(slot.start[1], to[index].start[1])],
          segs: slot.segs.map((segment, at) => segment.map((value, i) => mix(value, to[index].segs[at][i]))),
        }));
      }

      const SPIN_ANGLES = [45, -45, 90, -90, 135, -135, 180];

      function spinBetween(aMarkup, bMarkup) {
        const a = iconForm(aMarkup);
        const b = iconForm(bMarkup);
        if (a.unsupported.length || b.unsupported.length || a.viewBox.join() !== b.viewBox.join()) return null;
        const segments = (form) => form.slots.reduce((sum, slot) => sum + slot.segs.length, 0);
        if (!a.slots.length || segments(a) !== segments(b)) return null;
        const unique = (points) => points.filter((point, index) => points.findIndex((other) => Math.hypot(other[0] - point[0], other[1] - point[1]) < 0.02) === index);
        const from = unique(a.slots.flatMap(anchorsOf));
        const to = unique(b.slots.flatMap(anchorsOf));
        if (from.length !== to.length) return null;
        const [vx, vy, vw, vh] = a.viewBox;
        const [cx, cy] = [vx + vw / 2, vy + vh / 2];
        const same = (one, two) => one.every((point) => two.some((other) => Math.hypot(other[0] - point[0], other[1] - point[1]) < 0.02));
        if (same(from, to)) return null;
        for (const angle of SPIN_ANGLES) {
          const radians = (angle * Math.PI) / 180;
          const turned = from.map(([x, y]) => [
            cx + (x - cx) * Math.cos(radians) - (y - cy) * Math.sin(radians),
            cy + (x - cx) * Math.sin(radians) + (y - cy) * Math.cos(radians),
          ]);
          if (same(turned, to)) return angle;
        }
        return null;
      }

      function drawnIssues(a, b) {
        const issues = [...formIssues(a), ...formIssues(b)];
        if (a.viewBox !== b.viewBox) issues.unshift(`${a.icon.name} is on ${a.viewBox}, ${b.icon.name} is on ${b.viewBox}`);
        if (!issues.length) {
          if (a.morph.slots !== b.morph.slots) issues.push(`${a.icon.name} has ${a.morph.slots} paths, ${b.icon.name} has ${b.morph.slots}`);
          else a.morph.shapes.forEach((count, index) => {
            if (count !== b.morph.shapes[index]) issues.push(`path ${index + 1} has ${count} segments in ${a.icon.name} and ${b.morph.shapes[index]} in ${b.icon.name}`);
          });
        }
        return issues;
      }

      function drawnTravel(a, b) {
        let distance = 0;
        let points = 0;
        a.morph.d.forEach((d, index) => {
          const from = (d.match(NUMBER) ?? []).map(Number);
          const to = (b.morph.d[index].match(NUMBER) ?? []).map(Number);
          for (let i = 0; i + 1 < from.length; i += 2) {
            distance += Math.hypot(to[i] - from[i], to[i + 1] - from[i + 1]);
            points += 1;
          }
        });
        return points ? distance / points : 0;
      }

      function planMorph(a, b, aMarkup, bMarkup) {
        const angle = spinBetween(aMarkup, bMarkup);
        if (angle != null) return { kind: "spin", angle };
        if (morphable(a, b)) return { kind: "drawn", travel: drawnTravel(a, b) };
        const issues = drawnIssues(a, b);
        const converted = convertPair(aMarkup, bMarkup);
        if (converted) return { kind: "converted", converted, travel: converted.travel, issues };
        const blocked = [a, b].flatMap((entry) => {
          const { unsupported } = iconForm(entry === a ? aMarkup : bMarkup);
          return unsupported.length ? [`${entry.icon.name} uses ${unsupported.join(", ")}, which the sheet cannot convert`] : [];
        });
        return { kind: "fade", issues: blocked.length ? blocked : issues };
      }

      function createPlayer(plan, a, b, aMarkup, bMarkup, size, color) {
        const node = h("div", { class: "player" });
        if (plan.kind === "spin") {
          const svg = sized(aMarkup, size);
          node.append(svg);
          return { node, frame: (t) => { svg.style.rotate = `${plan.angle * easeInOut(t)}deg`; } };
        }
        if (plan.kind === "drawn") {
          const svg = sized(aMarkup, size);
          const paths = [...svg.querySelectorAll("path")];
          const tracks = paths.map((path, index) => ({
            path,
            template: a.morph.d[index].split(NUMBER),
            from: (a.morph.d[index].match(NUMBER) ?? []).map(Number),
            to: (b.morph.d[index].match(NUMBER) ?? []).map(Number),
          }));
          const fillFrom = parse(aMarkup).getAttribute("fill") === "none" ? 0 : 1;
          const fillTo = parse(bMarkup).getAttribute("fill") === "none" ? 0 : 1;
          if (fillFrom !== fillTo) svg.setAttribute("fill", color ?? "currentColor");
          node.append(svg);
          return {
            node,
            frame(t) {
              const k = easeInOut(t);
              for (const { path, template, from, to } of tracks) {
                path.setAttribute("d", template.map((part, i) => (i < from.length ? part + +(from[i] + (to[i] - from[i]) * k).toFixed(3) : part)).join(""));
              }
              if (fillFrom !== fillTo) svg.setAttribute("fill-opacity", fillFrom + (fillTo - fillFrom) * k);
            },
          };
        }
        if (plan.kind === "converted") {
          const svg = sized(aMarkup, size);
          const rootA = parse(aMarkup);
          const rootB = parse(bMarkup);
          const ink = color ?? "currentColor";
          const paint = (entry) => ({ fill: entry.kind === "Outline" ? 0 : 1, stroke: entry.stroke ? 1 : 0 });
          const [from, to] = [paint(a), paint(b)];
          svg.replaceChildren();
          for (const name of ["fill", "stroke", "fill-rule", "stroke-width", "stroke-linecap", "stroke-linejoin"]) svg.removeAttribute(name);
          svg.setAttribute("fill", ink);
          svg.setAttribute("stroke", ink);
          svg.setAttribute("fill-rule", "evenodd");
          svg.setAttribute("stroke-width", a.stroke || b.stroke || 1.5);
          svg.setAttribute("stroke-linecap", rootA.getAttribute("stroke-linecap") ?? rootB.getAttribute("stroke-linecap") ?? "round");
          svg.setAttribute("stroke-linejoin", rootA.getAttribute("stroke-linejoin") ?? rootB.getAttribute("stroke-linejoin") ?? "round");
          const path = document.createElementNS(SVG_NS, "path");
          svg.append(path);
          node.append(svg);
          return {
            node,
            frame(t) {
              const k = easeInOut(t);
              path.setAttribute("d", slotsD(lerpSlots(plan.converted.from, plan.converted.to, k)));
              svg.setAttribute("fill-opacity", from.fill + (to.fill - from.fill) * k);
              svg.setAttribute("stroke-opacity", from.stroke + (to.stroke - from.stroke) * k);
            },
          };
        }
        const one = sized(aMarkup, size);
        const two = sized(bMarkup, size);
        node.append(one, two);
        return {
          node,
          frame(t) {
            const k = easeInOut(t);
            one.style.cssText = `opacity:${1 - k};scale:${1 - 0.2 * k};filter:blur(${4 * k}px)`;
            two.style.cssText = `opacity:${k};scale:${0.8 + 0.2 * k};filter:blur(${4 * (1 - k)}px)`;
          },
        };
      }

      /* Customising: overrides apply to every icon until reset */

      function customise(markup, custom) {
        const svg = parse(markup).cloneNode(true);
        const nodes = [svg, ...svg.querySelectorAll("*")];
        const stroked = nodes.some((node) => node.hasAttribute("stroke") && node.getAttribute("stroke") !== "none");
        if (stroked) {
          for (const [name, value] of [["stroke-width", custom.stroke], ["stroke-linecap", custom.caps], ["stroke-linejoin", custom.joins]]) {
            if (value == null) continue;
            svg.setAttribute(name, value);
            for (const node of nodes) if (node !== svg && node.hasAttribute(name)) node.setAttribute(name, value);
          }
        }
        for (const name of ["width", "height", "aria-hidden"]) svg.removeAttribute(name);
        const out = svg.outerHTML;
        return custom.color ? out.replaceAll("currentColor", custom.color) : out;
      }

      function exportSvg(markup, size) {
        const svg = parse(markup).cloneNode(true);
        svg.setAttribute("xmlns", "http://www.w3.org/2000/svg");
        svg.setAttribute("width", size);
        svg.setAttribute("height", size);
        return svg.outerHTML;
      }

      function rasterAt(markup, px, color, size) {
        const svg = sized(markup, px);
        svg.setAttribute("xmlns", "http://www.w3.org/2000/svg");
        const canvas = h("canvas", { width: px, height: px, style: `width:${size}px;height:${size}px;image-rendering:pixelated` });
        const image = new Image();
        image.onload = () => canvas.getContext("2d").drawImage(image, 0, 0);
        image.src = `data:image/svg+xml,${encodeURIComponent(svg.outerHTML.replaceAll("currentColor", color))}`;
        return canvas;
      }

      const SWATCHES = [
        { label: "Ink", value: null },
        { label: "Blue", value: "#0077b6" },
        { label: "Red", value: "#d93036" },
        { label: "Green", value: "#2f9e44" },
        { label: "Orange", value: "#e8590c" },
        { label: "Violet", value: "#7048e8" },
      ];

      function slider({ label, min, max, step, value, display, disabled, onInput }) {
        const fill = h("div", { class: "bar-fill" });
        const out = h("span", { class: "num" });
        const node = h("div", {
          class: "bar slider", role: "slider", tabindex: disabled ? "-1" : "0", "aria-label": label,
          "aria-valuemin": min, "aria-valuemax": max, ...(disabled ? { "aria-disabled": "true" } : {}),
        }, fill, h("span", {}, label), out);
        let current = value;
        const set = (next, emit) => {
          current = +Math.min(max, Math.max(min, Math.round(next / step) * step)).toFixed(4);
          fill.style.width = `${((current - min) / (max - min)) * 100}%`;
          out.textContent = display(current);
          node.setAttribute("aria-valuenow", current);
          node.setAttribute("aria-valuetext", display(current));
          if (emit) onInput(current);
        };
        set(value, false);
        if (!disabled) {
          const fromPointer = (event) => {
            const box = node.getBoundingClientRect();
            set(min + ((event.clientX - box.left) / box.width) * (max - min), true);
          };
          node.addEventListener("pointerdown", (event) => { node.setPointerCapture(event.pointerId); fromPointer(event); });
          node.addEventListener("pointermove", (event) => { if (node.hasPointerCapture(event.pointerId)) fromPointer(event); });
          node.addEventListener("keydown", (event) => {
            const keys = { ArrowRight: step, ArrowUp: step, ArrowLeft: -step, ArrowDown: -step, PageUp: step * 4, PageDown: -step * 4 };
            const jump = { Home: min, End: max }[event.key];
            if (!(event.key in keys) && jump == null) return;
            event.preventDefault();
            event.stopPropagation();
            set(jump ?? current + keys[event.key], true);
          });
        }
        return { node, set: (next) => set(next, false) };
      }

      function field(label, control) {
        return h("div", { class: "field" }, h("span", { class: "field-label" }, label), control);
      }

      /* Prompts for an agent */

      const specBlock = (spec) => specLines(spec).map(([key, value]) => `- ${key}: ${value}`).join("\n");
      const fence = (svg) => `\`\`\`svg\n${svg}\n\`\`\``;
      const located = (icon) => (icon.added ? "the icon sheet, pasted and not yet in a file" : `\`${icon.file}\``);
      const morphShapeOf = (spec, a, b) => ({
        slots: spec.morph.slots || Math.max(a.morph.slots, b?.morph.slots ?? 0, 1),
        segments: spec.morph.segments || 4,
      });

      function prompts({ result, measured, markup, target, verdict, spec, sibling }) {
        const { icon } = result;
        const form = morphShapeOf(spec, result.entry, target);
        const list = [];
        if (measured.misses.length) {
          list.push({
            title: "Fix The Findings",
            note: `${measured.misses.length} ${measured.misses.length === 1 ? "finding" : "findings"} against the spec.`,
            text: [
              `Fix the ${icon.name} icon at ${located(icon)} so it passes the icon spec for ${sheet.title}.`,
              "",
              "Findings:",
              ...measured.misses.map((miss) => `- [${miss.rule}] ${miss.text}`),
              "",
              `The spec, measured from the ${spec.count} icons in \`${sheet.source}\`:`,
              specBlock(spec),
              "",
              "Current markup:",
              "",
              fence(markup),
              "",
              "Change only this icon and keep its silhouette. Then reopen the icon sheet and confirm the findings are gone.",
            ].join("\n"),
          });
        }
        list.push({
          title: "Redraw To Spec",
          note: "Keeps what it means and redraws how it is built.",
          text: [
            `Redraw the ${icon.name} icon at ${located(icon)} on the icon spec for ${sheet.title}. Keep what it means and fix how it is drawn.`,
            "",
            `The spec, measured from the ${spec.count} icons in \`${sheet.source}\`:`,
            specBlock(spec),
            ...(icon.new ? ["", `Keep it in the morph form: ${form.slots} paths, each an M followed by ${form.segments} explicit C segments.`] : []),
            "",
            "Current markup:",
            "",
            fence(markup),
            "",
            "Return one <svg> that uses currentColor. Then reopen the icon sheet and confirm it passes.",
          ].join("\n"),
        });
        if (target) {
          list.push({
            title: `Morph Into ${target.icon.name}`,
            note: { drawn: "They morph today. Asks for a tighter pairing.", spin: "One shape turned. Asks for one form and a rotation." }[verdict.kind] ?? "Not in the morph form yet. Asks for it.",
            text: [
              `Make ${icon.name} and ${target.icon.name} morph into each other on the icon sheet for ${sheet.title}.`,
              "",
              `Draw both in the morph form: ${form.slots} paths, each an M followed by ${form.segments} explicit C segments, and no other elements.`,
              "Path 1 in one icon becomes path 1 in the other, so order the paths by the part each one turns into, and start each path at the point it should travel from.",
              "",
              ...(verdict.kind === "drawn"
                ? [`They already share the form and points travel ${format(verdict.travel)} units on average. Reorder starts and segments so they travel less and nothing crosses mid-way.`]
                : verdict.kind === "spin"
                  ? [`${target.icon.name} is ${icon.name} turned ${verdict.angle}°. Draw them as one morph form and rotate the whole icon between them instead of moving points.`]
                  : ["Why they do not morph as drawn:", ...verdict.issues.map((issue) => `- ${issue}`)]),
              "",
              `${icon.name} at ${located(icon)}:`,
              "",
              fence(markup),
              "",
              `${target.icon.name} at ${located(target.icon)}:`,
              "",
              fence(target.icon.svg),
              "",
              "Keep both on the spec:",
              specBlock(spec),
              "",
              "Then open the icon sheet, put both in the Morph sequence and click the step between them to check the middle.",
            ].join("\n"),
          });
        }
        const name = sibling.trim() || "<name>";
        list.push({
          title: "Draw A Sibling",
          note: `A new icon drawn to match ${icon.name}.`,
          sibling: true,
          text: [
            `Draw a new icon named ${name} for ${sheet.title} in \`${sheet.source}\`, to sit beside ${icon.name}.`,
            "",
            "Match the spec:",
            specBlock(spec),
            "",
            `Draw it in the morph form, ${form.slots} paths of M and ${form.segments} C segments, so it morphs into the other new icons. Use ${icon.name} as the reference for weight and padding:`,
            "",
            fence(markup),
            "",
            "Add it to the sheet as a new icon, then reopen the sheet and confirm it passes.",
          ].join("\n"),
        });
        return list;
      }

      function promptCard(prompt, siblingInput) {
        return h("div", { class: "prompt" },
          h("div", { class: "prompt-head" },
            h("div", {}, h("p", { class: "prompt-title" }, prompt.title), h("p", { class: "prompt-note" }, prompt.note)),
            copyButton("Copy", () => prompt.text)),
          prompt.sibling ? siblingInput : null,
          h("details", { class: "disclosure" }, h("summary", {}, "Preview"), h("pre", {}, prompt.text)));
      }

      /* The inspector, shared by every variant */

      function createInspector(data, { layout, size, onClose, onStep }) {
        const { spec } = data;
        const TABS = ["Inspect", "Customise", "Morph", "Prompts"];
        const view = { tab: "Inspect", theme: pageTheme(), grid: false, pixels: false };
        const custom = { size: 20, stroke: null, caps: null, joins: null, color: null };
        const morph = { sequence: [], pos: 0, segment: 0, playing: false, slow: false, raf: 0 };
        const MAX_STEPS = 8;
        const KIND = { spin: "Spins", drawn: "Morphs", converted: "Converted", fade: "Cross-Fades" };
        let result = null;
        let measured = null;
        let sibling = "";
        let token = 0;
        let players = [];
        let shownPlayer = null;
        let liveNote = null;

        const stageGlyph = createStage(size);
        const lines = h("div", { html: keylines(spec, size), style: "position:absolute;inset:0" });
        stageGlyph.holder.append(lines);
        const count = h("span", { class: "stage-count" });
        const iconButton = (label, icon, action) => {
          const node = h("button", { class: "icon-button", type: "button", "aria-label": label, title: label }, svgIcon(icon));
          node.addEventListener("click", action);
          return node;
        };
        const playButton = h("button", { class: "icon-button", type: "button" });
        playButton.addEventListener("click", () => (morph.playing ? pause() : play()));
        const steps = h("div", { class: "steps" });
        const addButton = h("button", { class: "icon-button", type: "button", "aria-label": "Add To Sequence", title: "Add To Sequence", "aria-expanded": "false" }, svgIcon(CHROME.plus));
        addButton.addEventListener("click", () => (picker.hidden ? openPicker() : closePicker()));
        const picker = h("div", { class: "picker", role: "group", "aria-label": "Add To Sequence", hidden: "" });
        picker.addEventListener("keydown", (event) => {
          if (event.key !== "Escape") return;
          event.preventDefault();
          event.stopPropagation();
          closePicker();
          addButton.focus();
        });
        const speed = h("div", { class: "segmented", role: "group", "aria-label": "Speed" }, ...[["1×", "Normal Speed"], ["¼×", "Quarter Speed"]].map(([label, name]) => {
          const button = h("button", { type: "button", "aria-label": name, title: name, "aria-pressed": String((label === "¼×") === morph.slow) }, label);
          button.addEventListener("click", () => {
            morph.slow = label === "¼×";
            for (const other of speed.children) other.setAttribute("aria-pressed", String(other === button));
          });
          return button;
        }));
        const timeline = h("div", { class: "timeline", role: "group", "aria-label": "Morph Sequence", hidden: "" }, playButton, steps, addButton, speed);
        const stage = h("div", { class: "stage surface", "data-theme": view.theme },
          h("div", { class: "stage-top" },
            h("div", { style: "display:flex;gap:2px" }, iconButton("Previous Icon", CHROME.prev, () => onStep(-1)), iconButton("Next Icon", CHROME.next, () => onStep(1))),
            count),
          h("div", { class: "stage-view" }, stageGlyph.holder),
          timeline,
          picker);
        stage.addEventListener("pointerdown", (event) => {
          if (!picker.hidden && !picker.contains(event.target) && !addButton.contains(event.target)) closePicker();
        });
        const showPlaying = () => {
          const label = morph.playing ? "Pause" : "Play";
          playButton.replaceChildren(svgIcon(morph.playing ? CHROME.pause : CHROME.play));
          playButton.setAttribute("aria-label", label);
          playButton.title = label;
        };
        showPlaying();

        const head = h("div", { class: "panel-head" });
        const tabButtons = TABS.map((tab) => {
          const button = h("button", { type: "button", "aria-pressed": String(tab === view.tab) }, tab);
          button.addEventListener("click", () => {
            view.tab = tab;
            for (const other of tabButtons) other.setAttribute("aria-pressed", String(other === button));
            if (tab === "Morph" && !reduced.matches) morph.playing = true;
            renderBody();
            refreshStage();
          });
          return button;
        });
        const tabs = h("div", { class: "segmented tabs", role: "group", "aria-label": "Inspector View" }, ...tabButtons);
        const body = h("div", { class: "tab-body" });
        const foot = h("div", { class: "panel-foot" },
          copyButton("Copy SVG", () => exportSvg(customised(), custom.size)),
          copyButton("Copy Prompt", () => promptList()[0].text));
        const panel = h("aside", { class: "panel" }, head, tabs, body, foot);
        const node = h("div", { class: "insp", "data-layout": layout }, stage, panel);
        const maxInk = Math.max(...Object.values(spec.ranges).map(([, high]) => high)) * 1.4;

        const customised = () => customise(result.icon.svg, custom);
        const markupOf = (entry) => customise(entry.icon.svg, custom);
        const planBetween = (a, b) => planMorph(a, b, markupOf(a), markupOf(b));
        const firstTarget = () => morph.sequence[1] ?? null;
        const isCustom = () => custom.stroke != null || custom.caps != null || custom.joins != null || custom.color != null;
        const promptList = () => prompts({
          result, measured, markup: customised(), target: firstTarget(),
          verdict: firstTarget() ? planBetween(result.entry, firstTarget()) : null, spec, sibling,
        });

        function seedSequence() {
          const known = new Set(data.results.map((other) => other.entry));
          const kept = morph.sequence.slice(1).filter((entry) => entry !== result.entry && known.has(entry));
          const others = data.results.filter((other) => other !== result);
          const fallback = (others.find((other) => morphable(result.entry, other.entry)) ?? others[0])?.entry;
          morph.sequence = [result.entry, ...(kept.length ? kept : fallback ? [fallback] : [])];
          morph.pos = 0;
          morph.segment = 0;
        }

        async function remeasure() {
          const mine = ++token;
          if (!isCustom()) {
            measured = { entry: result.entry, misses: result.misses, status: result.status };
          } else {
            const entry = await measure({ ...result.icon, svg: customised() });
            if (mine !== token) return;
            const misses = lint(entry, spec);
            measured = { entry, misses, status: statusOf(entry, misses, spec) };
          }
          renderHead();
          if (liveNote) liveNote.textContent = noteText();
          if (view.tab === "Inspect") renderBody();
        }

        const noteText = () => {
          const suffix = isCustom() ? " as customised" : "";
          const misses = measured.misses.length;
          return misses ? `${misses} ${misses === 1 ? "finding" : "findings"} against the spec${suffix}.` : `Passes the spec${suffix}.`;
        };

        function changed() {
          refreshStage();
          renderHead();
          remeasure();
        }

        function renderHead() {
          const { icon } = result;
          head.replaceChildren(...[
            h("span", { class: "panel-title" }, icon.name),
            icon.new ? h("span", { class: "chip", "data-new": "" }, icon.added ? "Added" : "New") : null,
            measured.status === "Pass" && !icon.new ? null : h("span", { class: "chip", "data-status": measured.status }, measured.status),
            isCustom() ? h("span", { class: "chip" }, "Customised") : null,
            iconButton("Close", CHROME.close, onClose)].filter(Boolean));
        }

        const bar = (label, value, display, max, range) => h("div", { class: "bar" },
          h("div", { class: "bar-fill", style: `width:${Math.min(100, Math.max(0, value / max) * 100)}%` }),
          range ? h("div", { class: "bar-range", title: "The set's range", style: `left:${(range[0] / max) * 100}%;width:${((range[1] - range[0]) / max) * 100}%` }) : null,
          h("span", {}, label), h("span", { class: "num" }, display));

        function renderInspect() {
          const { entry, misses, status } = measured;
          return [
            h("div", {},
              segmented("Fill", ["Light", "Dark"], view.theme === "light" ? "Light" : "Dark", (value) => { view.theme = value.toLowerCase(); refreshStage(); }),
              segmented("Grid", ["Off", "On"], view.grid ? "On" : "Off", (value) => { view.grid = value === "On"; refreshStage(); }),
              segmented("Pixels", ["Off", "On"], view.pixels ? "On" : "Off", (value) => { view.pixels = value === "On"; refreshStage(); })),
            h("div", { class: "bars" },
              bar("Stroke", entry.stroke, entry.stroke ? format(entry.stroke) : "None", 3),
              bar("Inset", entry.inset, `${format(entry.inset)}, ${entry.edge}`, spec.padding * 2 || 4),
              bar("Ink", entry.coverage ?? 0, entry.coverage == null ? "Not Verified" : percent(entry.coverage), maxInk, spec.ranges[entry.kind])),
            h("div", {},
              h("p", { class: "section-title" }, "Findings"),
              findingList(misses, status === "Not Verified" ? "The set has no icons of this kind to compare." : "Passes the spec.", false)),
          ];
        }

        function renderCustomise() {
          const { entry } = result;
          const root = parse(result.icon.svg);
          const title = (value) => value[0].toUpperCase() + value.slice(1);
          const swatches = SWATCHES.map((swatch) => {
            const button = h("button", {
              class: "swatch-button", type: "button", "aria-label": swatch.label, title: swatch.label,
              "aria-pressed": String(custom.color === swatch.value), style: `background:${swatch.value ?? "var(--text-primary)"}`,
            });
            button.addEventListener("click", () => {
              custom.color = swatch.value;
              for (const other of swatchRow.querySelectorAll(".swatch-button")) other.setAttribute("aria-pressed", String(other === button));
              changed();
            });
            return button;
          });
          const picker = h("input", { class: "color-input", type: "color", "aria-label": "Custom Colour", title: "Custom Colour", value: custom.color ?? "#080808" });
          picker.addEventListener("input", () => {
            custom.color = picker.value;
            for (const other of swatchRow.querySelectorAll(".swatch-button")) other.setAttribute("aria-pressed", "false");
            changed();
          });
          const swatchRow = h("div", { class: "swatches" }, ...swatches, picker);
          liveNote = h("p", { class: "live-note", role: "status" }, noteText());
          const reset = h("button", { class: "button", type: "button" }, "Reset");
          reset.addEventListener("click", () => {
            Object.assign(custom, { size: 20, stroke: null, caps: null, joins: null, color: null });
            renderBody();
            changed();
          });
          return [
            h("div", { class: "bars" },
              slider({
                label: "Size", min: 12, max: 64, step: 1, value: custom.size, display: (value) => `${value}px`,
                onInput: (value) => { custom.size = value; refreshStage(); },
              }).node,
              slider({
                label: "Stroke", min: 0.5, max: 3, step: 0.25, value: custom.stroke ?? (entry.stroke || 1.5), disabled: !entry.stroke,
                display: (value) => (entry.stroke ? format(value) : "None, filled"),
                onInput: (value) => { custom.stroke = value; changed(); },
              }).node),
            entry.stroke ? h("div", {},
              segmented("Caps", ["Round", "Butt", "Square"], title(custom.caps ?? root.getAttribute("stroke-linecap") ?? "butt"), (value) => { custom.caps = value.toLowerCase(); changed(); }),
              segmented("Joins", ["Round", "Miter", "Bevel"], title(custom.joins ?? root.getAttribute("stroke-linejoin") ?? "miter"), (value) => { custom.joins = value.toLowerCase(); changed(); })) : null,
            field("Colour", swatchRow),
            h("div", { class: "controls" }, liveNote, reset),
          ];
        }

        function verdictBody(plan, from, to) {
          return {
            spin: () => h("p", {}, `${to.icon.name} is ${from.icon.name} turned ${plan.angle}°, so it rotates instead of morphing.`),
            drawn: () => h("p", {}, `Both are drawn in the morph form, so this is the morph that ships. Points travel ${format(plan.travel)} on average.`),
            converted: () => h("div", { class: "verdict-body" },
              h("p", {}, "Not drawn in the morph form yet, so the sheet converted both for this preview. The Morph Into prompt asks for the real one."),
              h("ul", {}, ...plan.issues.map((issue) => h("li", {}, issue)))),
            fade: () => h("ul", {}, ...plan.issues.map((issue) => h("li", {}, issue))),
          }[plan.kind]();
        }

        function renderMorph() {
          const { sequence } = morph;
          const rows = sequence.slice(1).map((to, index) => {
            const from = sequence[index];
            const plan = planBetween(from, to);
            const open = index === morph.segment;
            const row = h("button", { class: "transition", type: "button", "aria-expanded": String(open) },
              h("span", {}, `${from.icon.name} to ${to.icon.name}`),
              h("span", { class: "chip", ...(plan.kind === "fade" || plan.kind === "converted" ? {} : { "data-new": "" }) }, KIND[plan.kind]));
            row.addEventListener("click", () => selectSegment(index));
            return h("div", { class: "verdict" }, row, open ? verdictBody(plan, from, to) : null);
          });
          const name = h("input", { class: "input", type: "text", placeholder: "Icon Name", "aria-label": "Icon Name" });
          const markup = h("textarea", { class: "input textarea", rows: "5", spellcheck: "false", placeholder: "<svg viewBox=\"0 0 16 16\">", "aria-label": "SVG Markup" });
          const error = h("p", { class: "error", role: "status" });
          const add = h("button", { class: "button", type: "button" }, "Add To Sequence");
          add.addEventListener("click", async () => {
            const added = await data.addIcon(name.value, markup.value);
            if (!added) { error.textContent = "Paste markup that starts with <svg."; return; }
            insertStep(added.entry);
          });
          return [
            h("p", { class: "live-note" }, rows.length
              ? "Add icons with the plus under the stage. Each step says how one icon turns into the next."
              : "Add an icon with the plus under the stage to see how this one turns into it."),
            ...rows,
            h("details", { class: "disclosure" },
              h("summary", {}, "Paste An SVG"),
              h("div", { class: "paste" }, name, markup, error, add)),
          ];
        }

        function renderPrompts() {
          const siblingInput = h("input", { class: "input", type: "text", placeholder: "New Icon Name", "aria-label": "New Icon Name", value: sibling });
          const list = promptList();
          const cards = list.map((prompt) => promptCard(prompt, siblingInput));
          siblingInput.addEventListener("input", () => {
            sibling = siblingInput.value;
            const fresh = promptList().at(-1);
            list[list.length - 1].text = fresh.text;
            cards.at(-1).querySelector("pre").textContent = fresh.text;
          });
          return cards;
        }

        function renderBody() {
          if (view.tab !== "Morph") pause();
          liveNote = null;
          const render = { Inspect: renderInspect, Customise: renderCustomise, Morph: renderMorph, Prompts: renderPrompts }[view.tab];
          body.replaceChildren(...render().filter(Boolean));
        }

        function refreshStage() {
          stage.dataset.theme = view.theme;
          lines.firstElementChild.toggleAttribute("data-on", view.grid && view.tab !== "Morph");
          timeline.hidden = view.tab !== "Morph";
          if (view.tab !== "Morph") closePicker();
          players = [];
          shownPlayer = null;
          if (view.tab === "Morph") {
            players = morph.sequence.slice(1).map((to, index) => {
              const from = morph.sequence[index];
              return createPlayer(planBetween(from, to), from, to, markupOf(from), markupOf(to), size, custom.color);
            });
            renderTimeline();
            if (players.length) {
              paintFrame();
              if (morph.playing) play();
              return;
            }
          }
          pause();
          stageGlyph.overlay(null);
          const markup = customised();
          const ink = custom.color ?? INK[view.theme];
          stageGlyph.show(result.entry, markup, view.pixels ? () => rasterAt(markup, custom.size, ink, size) : null,
            `${view.pixels}:${custom.size}:${view.theme}:${markup}`);
        }

        function renderTimeline() {
          const { sequence } = morph;
          const nodes = [];
          sequence.forEach((entry, index) => {
            if (index > 0) {
              const plan = planBetween(sequence[index - 1], entry);
              const link = h("button", {
                class: "step-link", type: "button", "data-kind": plan.kind, "aria-pressed": String(index - 1 === morph.segment),
                "aria-label": `${sequence[index - 1].icon.name} to ${entry.icon.name}, ${KIND[plan.kind]}`, title: KIND[plan.kind],
              }, h("span", { class: "step-line" }, h("span", { class: "step-fill" })), h("span", { class: "step-kind" }, KIND[plan.kind]));
              link.addEventListener("click", () => selectSegment(index - 1));
              nodes.push(link);
            }
            const key = h("button", { class: "step", type: "button", "aria-label": entry.icon.name, title: entry.icon.name }, sized(entry.icon.svg, 16));
            key.addEventListener("click", () => jump(index));
            const wrap = h("span", { class: "step-wrap" }, key);
            if (index > 0) {
              key.setAttribute("aria-keyshortcuts", "Delete");
              key.addEventListener("keydown", (event) => {
                if (event.key !== "Delete" && event.key !== "Backspace") return;
                event.preventDefault();
                removeStep(index, true);
              });
              const remove = h("button", { class: "step-remove", type: "button", tabindex: "-1", "aria-label": `Remove ${entry.icon.name}`, title: "Remove" }, svgIcon(CHROME.close));
              remove.addEventListener("click", () => removeStep(index, false));
              wrap.append(remove);
            }
            nodes.push(wrap);
          });
          steps.replaceChildren(...nodes);
          addButton.disabled = sequence.length >= MAX_STEPS;
          playButton.disabled = sequence.length < 2;
        }

        function paintFrame() {
          const segment = Math.max(0, Math.min(Math.floor(morph.pos), players.length - 1));
          const current = players[segment];
          if (current !== shownPlayer) {
            stageGlyph.overlay(current.node);
            shownPlayer = current;
          }
          current.frame(morph.pos - segment);
          steps.querySelectorAll(".step-fill").forEach((fill, index) => {
            fill.style.width = `${index < segment ? 100 : index === segment ? (morph.pos - segment) * 100 : 0}%`;
          });
          steps.querySelectorAll(".step").forEach((key, index) => key.toggleAttribute("data-current", Math.round(morph.pos) === index));
        }

        function jump(index) {
          pause();
          morph.pos = index;
          if (index < morph.sequence.length - 1) morph.segment = index;
          renderBody();
          renderTimeline();
          if (players.length) paintFrame();
        }

        function selectSegment(index) {
          pause();
          morph.segment = index;
          morph.pos = index + 0.5;
          renderBody();
          renderTimeline();
          paintFrame();
        }

        function insertStep(entry) {
          if (morph.sequence.length >= MAX_STEPS || morph.sequence.at(-1) === entry) return;
          morph.sequence.push(entry);
          morph.segment = morph.sequence.length - 2;
          morph.pos = morph.segment;
          morph.playing = !reduced.matches;
          for (const item of picker.children) item.disabled = item.dataset.index === String(data.results.findIndex((other) => other.entry === entry));
          if (morph.sequence.length >= MAX_STEPS) closePicker();
          renderBody();
          refreshStage();
        }

        function removeStep(index, refocus) {
          morph.sequence.splice(index, 1);
          morph.segment = Math.max(0, Math.min(morph.segment, morph.sequence.length - 2));
          morph.pos = Math.min(morph.pos, Math.max(0, morph.sequence.length - 1));
          renderBody();
          refreshStage();
          if (refocus) steps.querySelectorAll(".step")[index - 1]?.focus();
        }

        function openPicker() {
          const last = morph.sequence.at(-1);
          picker.replaceChildren(...data.results.map((other, index) => {
            const item = h("button", { class: "picker-item", type: "button", "data-index": index, "aria-label": other.icon.name, title: other.icon.name }, sized(other.icon.svg, 16));
            item.disabled = other.entry === last;
            item.addEventListener("click", () => insertStep(other.entry));
            return item;
          }));
          picker.hidden = false;
          addButton.setAttribute("aria-expanded", "true");
          picker.querySelector("button:not(:disabled)")?.focus();
        }

        function closePicker() {
          picker.hidden = true;
          addButton.setAttribute("aria-expanded", "false");
        }

        function play() {
          cancelAnimationFrame(morph.raf);
          const end = morph.sequence.length - 1;
          if (end < 1) return pause();
          morph.playing = true;
          showPlaying();
          let direction = morph.pos >= end ? -1 : 1;
          let last = performance.now();
          let hold = 0;
          const tick = (now) => {
            if (!node.isConnected || !node.checkVisibility()) return pause();
            const elapsed = now - last;
            last = now;
            if (hold > 0) hold -= elapsed;
            else {
              const from = morph.pos;
              const stop = direction > 0 ? Math.floor(from) + 1 : Math.ceil(from) - 1;
              let next = reduced.matches ? stop : from + (direction * elapsed) / (MORPH_MS * (morph.slow ? 4 : 1));
              if (direction > 0 ? next >= stop : next <= stop) {
                next = stop;
                hold = reduced.matches ? HOLD_MS : HOLD_MS / 2;
              }
              morph.pos = Math.min(end, Math.max(0, next));
              if (morph.pos === end || morph.pos === 0) direction = morph.pos === end ? -1 : 1;
            }
            paintFrame();
            morph.raf = requestAnimationFrame(tick);
          };
          morph.raf = requestAnimationFrame(tick);
        }

        function pause() {
          cancelAnimationFrame(morph.raf);
          morph.playing = false;
          showPlaying();
        }

        return {
          node,
          show(next, position, total) {
            result = next;
            measured = { entry: next.entry, misses: next.misses, status: next.status };
            if (position != null) count.textContent = `${position} of ${total}`;
            seedSequence();
            renderHead();
            renderBody();
            refreshStage();
            if (isCustom()) remeasure();
          },
        };
      }

      /* The main page */

      const VIEWS = { Icons: ["All", "New", "Issues", "Spec"], Review: ["Pixels", "Weight", "Morph"] };

      function morphPairs(results, spec) {
        const ready = results.filter((result) => result.icon.new && !lint(result.entry, spec).some((miss) => miss.rule === "icons-morph-form"));
        const pairs = new Map();
        for (const kind of new Set(ready.map((result) => result.entry.kind))) {
          const group = ready.filter((result) => result.entry.kind === kind);
          if (group.length < 2) continue;
          group.forEach((result, index) => pairs.set(result, group[(index + 1) % group.length]));
        }
        return pairs;
      }

      function measurements(results, open) {
        const head = ["Icon", "Kind", "Stroke", "Inset", "Ink", "Status"];
        return h("div", { class: "table", role: "table", "aria-label": "Measurements" },
          h("div", { class: "table-row table-head", role: "row" }, ...head.map((label) => h("span", { role: "columnheader" }, label))),
          ...results.map((result) => {
            const { entry } = result;
            const name = h("button", { class: "link", type: "button" }, result.icon.name);
            name.addEventListener("click", () => open(result));
            return h("div", { class: "table-row", role: "row" },
              h("span", { role: "cell" }, name, result.icon.new ? h("span", { class: "quiet" }, result.icon.added ? " Added" : " New") : null),
              h("span", { role: "cell", class: "quiet" }, entry.kind),
              h("span", { role: "cell", class: "quiet num" }, entry.stroke ? format(entry.stroke) : "None"),
              h("span", { role: "cell", class: "quiet num" }, `${format(entry.inset)}, ${entry.edge[0].toUpperCase()}${entry.edge.slice(1)}`),
              h("span", { role: "cell", class: "quiet num" }, entry.coverage == null ? "Not Verified" : percent(entry.coverage)),
              h("span", { role: "cell", class: "status", "data-status": result.status, title: result.misses.map((miss) => miss.text).join("; ") }, result.status));
          }));
      }

      function createApp(root, data) {
        const { results, spec } = data;
        const state = { view: "All", kind: "All", size: 20, theme: pageTheme(), query: "", open: -1 };
        const kinds = [...new Set(results.map((result) => result.entry.kind))];
        const counts = {
          All: () => results.length,
          New: () => results.filter((result) => result.icon.new).length,
          Issues: () => results.filter((result) => result.misses.length).length,
        };
        const countNodes = Object.fromEntries(Object.keys(counts).map((key) => [key, h("span", { class: "count" })]));
        let loop = 0;

        const tiles = h("div", { class: "tiles" });
        const content = h("div", { class: "content" });
        const crumb = h("span", {}, "All");
        const visible = () => results.filter((result) =>
          (state.view !== "New" || result.icon.new) &&
          (state.view !== "Issues" || result.misses.length) &&
          (state.kind === "All" || result.entry.kind === state.kind) &&
          result.icon.name.toLowerCase().includes(state.query.toLowerCase()));

        const navButtons = [];
        const navButton = (label, extra) => {
          const button = h("button", { type: "button", "aria-pressed": String(state.view === label) }, label, extra);
          button.addEventListener("click", () => {
            state.view = label;
            for (const other of navButtons) other.setAttribute("aria-pressed", String(other === button));
            crumb.textContent = label;
            paint();
          });
          navButtons.push(button);
          return button;
        };

        function tile(result, glyph, caption) {
          const index = results.indexOf(result);
          const label = result.misses.length ? result.status : result.icon.added ? "Added" : result.icon.new ? "New" : null;
          const node = h("button", {
            class: "tile surface", type: "button", "data-theme": state.theme, "data-index": index,
            "aria-label": `${caption ?? result.icon.name}${label ? `, ${label}` : ""}`, "aria-expanded": String(index === state.open),
          },
            glyph,
            label ? h("span", { class: "badge", "data-status": result.misses.length ? result.status : "New" }, label) : null,
            h("span", { class: "tile-name" }, caption ?? result.icon.name));
          node.addEventListener("click", () => open(index));
          return node;
        }

        function playAll(players) {
          cancelAnimationFrame(loop);
          let t = 0;
          let direction = 1;
          let hold = HOLD_MS;
          let last = performance.now();
          const tick = (now) => {
            if (!content.contains(players[0]?.node)) return;
            const elapsed = now - last;
            last = now;
            if (hold > 0) hold -= elapsed;
            else if (reduced.matches) {
              t = direction > 0 ? 1 : 0;
              direction = -direction;
              hold = HOLD_MS;
            } else {
              t = Math.min(1, Math.max(0, t + (direction * elapsed) / MORPH_MS));
              if (t === 0 || t === 1) {
                direction = -direction;
                hold = HOLD_MS;
              }
            }
            for (const player of players) player.frame(t);
            loop = requestAnimationFrame(tick);
          };
          loop = requestAnimationFrame(tick);
        }

        function paint() {
          for (const [key, node] of Object.entries(countNodes)) node.textContent = String(counts[key]());
          cancelAnimationFrame(loop);
          tiles.removeAttribute("data-large");
          if (state.view === "Spec") {
            const brands = sheet.icons.filter((icon) => icon.brand).map((icon) => icon.name);
            content.replaceChildren(h("div", { class: "spec-view" },
              h("div", { class: "card" },
                h("div", { class: "card-head" }, "Spec", copyButton("Copy Spec", data.copySpec)),
                h("p", { class: "card-note" }, `Measured from all ${spec.count} existing icons on ${spec.viewBox} in `, h("code", {}, sheet.source),
                  brands.length ? `. Brand marks left out: ${brands.join(", ")}.` : "."),
                specRows(spec)),
              h("div", { class: "card" },
                h("div", { class: "card-head" }, "Findings", copyButton("Copy Findings", data.copyFindings)),
                findingList(data.findings, data.drawn ? "Every new icon passes the spec." : "No new icons yet.")),
              h("div", { class: "card card-wide" },
                h("div", { class: "card-head" }, "Measurements", h("span", { class: "card-note" }, "Ink is the rendered stroke and fill")),
                measurements(results, (result) => open(results.indexOf(result))))));
            return;
          }
          const shown = visible();
          if (state.view === "Morph") {
            const pairs = morphPairs(results, spec);
            const players = [];
            tiles.replaceChildren(...shown.filter((result) => pairs.has(result)).map((result) => {
              const next = pairs.get(result);
              const player = createPlayer({ kind: "drawn" }, result.entry, next.entry, result.icon.svg, next.icon.svg, 48);
              players.push(player);
              return tile(result, player.node, `${result.icon.name} to ${next.icon.name}`);
            }));
            tiles.setAttribute("data-large", "");
            content.replaceChildren(players.length ? tiles : h("p", { class: "empty" }, "Morphs show once two new icons of one kind are in the morph form."));
            if (players.length) playAll(players);
            return;
          }
          tiles.replaceChildren(...shown.map((result) => {
            if (state.view === "Pixels") {
              const native = Number(result.entry.viewBox.split(" ")[2]) || 16;
              return tile(result, rasterAt(result.icon.svg, native, INK[state.theme], native * 3));
            }
            if (state.view === "Weight") return tile(result, h("span", { class: "blur" }, sized(result.icon.svg, 48)));
            return tile(result, sized(result.icon.svg, state.size));
          }));
          if (state.view === "Weight" || state.view === "Pixels") tiles.setAttribute("data-large", "");
          content.replaceChildren(shown.length ? tiles : h("p", { class: "empty" }, "No icons match."));
        }

        const search = h("input", { type: "search", placeholder: "Search icons", "aria-label": "Search icons" });
        search.addEventListener("input", () => { state.query = search.value; paint(); });
        const themeButton = h("button", { class: "icon-button", type: "button", "aria-label": "Dark Tiles", "aria-pressed": String(state.theme === "dark"), title: "Dark Tiles" }, svgIcon(CHROME.contrast));
        themeButton.addEventListener("click", () => {
          state.theme = state.theme === "light" ? "dark" : "light";
          themeButton.setAttribute("aria-pressed", String(state.theme === "dark"));
          if (state.view === "Pixels") paint();
          else for (const node of tiles.children) node.dataset.theme = state.theme;
        });

        const sidebar = h("nav", { class: "sidebar", "aria-label": "Views" },
          h("div", { class: "brand" }, sheet.title),
          h("div", {},
            h("p", { class: "side-label" }, "Icons"),
            h("div", { class: "nav" },
              navButton("All", countNodes.All),
              navButton("New", countNodes.New),
              navButton("Issues", countNodes.Issues),
              navButton("Spec", data.findings.length ? h("span", { class: "dot", title: "Findings" }) : null))),
          h("div", {},
            h("p", { class: "side-label" }, "Review"),
            h("div", { class: "nav" }, ...VIEWS.Review.map((label) => navButton(label)))));

        const styleSelect = dropdown("Style", [{ label: "All Styles", value: "All" }, ...kinds.map((kind) => ({ label: kind, value: kind }))], state.kind,
          (value) => { state.kind = value; paint(); });
        const sizeSelect = dropdown("Size", SIZES.map((size) => ({ label: `${size}px`, value: String(size) })), String(state.size),
          (value) => { state.size = Number(value); paint(); });

        const addName = h("input", { class: "input", type: "text", placeholder: "Icon Name", "aria-label": "Icon Name" });
        const addMarkup = h("textarea", { class: "input textarea", rows: "6", spellcheck: "false", placeholder: "<svg viewBox=\"0 0 16 16\">", "aria-label": "SVG Markup" });
        const addError = h("p", { class: "error", role: "status" });
        const addSubmit = h("button", { class: "button", type: "button" }, "Add Icon");
        const popover = h("div", { class: "popover", popover: "", id: "add-icon", role: "dialog", "aria-label": "Add An Icon" },
          h("p", { class: "popover-title" }, "Add An Icon"),
          h("p", { class: "popover-note" }, "Paste an SVG here, or drop .svg files on the grid."),
          addName, addMarkup, addError,
          h("div", { class: "popover-foot" }, addSubmit));
        popover.addEventListener("keydown", (event) => {
          if (event.key === "Escape") { event.preventDefault(); event.stopPropagation(); popover.hidePopover(); }
        });
        const reveal = (result) => {
          if (!result) return;
          state.view = "All";
          for (const other of navButtons) other.setAttribute("aria-pressed", String(other.firstChild.textContent === "All"));
          crumb.textContent = "All";
          state.kind = styleSelect.value = "All";
          state.query = search.value = "";
          paint();
          const index = results.indexOf(result);
          tiles.querySelector(`[data-index="${index}"]`)?.scrollIntoView({ block: "nearest" });
          open(index);
        };
        addSubmit.addEventListener("click", async () => {
          const added = await data.addIcon(addName.value, addMarkup.value);
          if (!added) { addError.textContent = "Paste markup that starts with <svg."; return; }
          addName.value = addMarkup.value = addError.textContent = "";
          popover.hidePopover();
          reveal(added);
        });
        content.addEventListener("dragover", (event) => {
          if (!event.dataTransfer.types.includes("Files")) return;
          event.preventDefault();
          content.setAttribute("data-drop", "");
        });
        content.addEventListener("dragleave", (event) => { if (!content.contains(event.relatedTarget)) content.removeAttribute("data-drop"); });
        content.addEventListener("drop", async (event) => {
          event.preventDefault();
          content.removeAttribute("data-drop");
          let last = null;
          for (const file of event.dataTransfer.files) {
            if (!file.name.toLowerCase().endsWith(".svg")) continue;
            last = (await data.addIcon(nameFromFile(file.name), await file.text())) ?? last;
          }
          reveal(last);
        });
        document.addEventListener("paste", async (event) => {
          if (event.target.closest?.("input, textarea")) return;
          const text = event.clipboardData.getData("text");
          if (!/^\s*<svg[\s>]/i.test(text)) return;
          event.preventDefault();
          reveal(await data.addIcon("", text));
        });

        const main = h("div", { class: "main" },
          h("div", { class: "topbar" },
            h("label", { class: "search" }, svgIcon(CHROME.search), search, h("span", { class: "kbd" }, "/")),
            styleSelect,
            sizeSelect,
            h("button", { class: "button", type: "button", popovertarget: popover.id }, "Add Icon"),
            copyButton("Copy Spec", data.copySpec),
            copyButton("Copy Findings", data.copyFindings),
            themeButton),
          h("div", { class: "crumbs" }, h("span", {}, sheet.title), h("span", {}, "/"), crumb),
          content);

        root.append(h("div", { class: "app" }, sidebar, main, popover));
        document.addEventListener("keydown", (event) => {
          if (event.key === "/" && document.activeElement !== search && !event.target.closest("input, textarea, select")) {
            event.preventDefault();
            search.focus();
          }
        });

        /* The inspector opens as a centred dialog */

        const dialog = h("dialog", { class: "modal", "aria-label": "Icon Details" });
        const box = h("div", { class: "modal-box" });
        dialog.append(box);
        document.body.append(dialog);
        const tileFor = (index) => tiles.querySelector(`[data-index="${index}"]`);
        const mark = () => {
          for (const node of tiles.children) node.setAttribute("aria-expanded", String(Number(node.dataset.index) === state.open));
        };
        const inspector = createInspector(data, { layout: "row", size: 224, onClose: () => close(), onStep: (delta) => step(delta) });
        box.append(inspector.node);

        function select(index) {
          state.open = index;
          const list = visible();
          const at = list.indexOf(results[index]);
          inspector.show(results[index], at < 0 ? null : at + 1, list.length);
          mark();
        }

        function step(delta) {
          const list = visible();
          if (!list.length) return;
          const at = list.indexOf(results[state.open]);
          const next = list[(at + delta + list.length) % list.length];
          select(results.indexOf(next));
        }

        function open(index) {
          select(index);
          if (dialog.open) return;
          dialog.showModal();
          if (!reduced.matches) {
            box.animate([{ opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1 }], { duration: 200, easing: EASE_OUT });
            dialog.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200, easing: EASE_OUT, pseudoElement: "::backdrop" });
          }
        }

        let closing = false;
        async function close() {
          if (!dialog.open || closing) return;
          closing = true;
          if (!reduced.matches) {
            await Promise.all([
              box.animate([{ opacity: 1, scale: 1 }, { opacity: 0, scale: 0.97 }], { duration: 150, easing: EASE_OUT, fill: "forwards" }).finished,
              dialog.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 150, easing: EASE_OUT, pseudoElement: "::backdrop", fill: "forwards" }).finished,
            ]);
          }
          dialog.close();
          box.getAnimations().forEach((animation) => animation.cancel());
          const node = tileFor(state.open);
          state.open = -1;
          mark();
          node?.focus();
          closing = false;
        }

        inspector.node.addEventListener("keydown", (event) => {
          if (event.target.closest("input, textarea, select, [role=slider], .timeline, .picker")) return;
          if (event.key === "ArrowRight" || event.key === "ArrowLeft") {
            event.preventDefault();
            step(event.key === "ArrowRight" ? 1 : -1);
          }
        });
        dialog.addEventListener("cancel", (event) => { event.preventDefault(); close(); });
        dialog.addEventListener("keydown", (event) => { if (event.key === "Escape") { event.preventDefault(); event.stopPropagation(); close(); } });
        dialog.addEventListener("click", (event) => { if (event.target === dialog) close(); });

        paint();
        return {
          paint,
          refresh() {
            paint();
            if (state.open >= 0) select(state.open);
          },
        };
      }

      (async () => {
        document.title = `${sheet.title} · Icons`;
        const icons = sheet.icons.filter((icon) => !icon.brand).sort((a, b) => a.name.localeCompare(b.name));
        const measured = [];
        for (const icon of icons) measured.push(await measure(icon));
        const spec = derive(measured);
        const results = measured.map((entry) => {
          const misses = lint(entry, spec);
          return { entry, icon: entry.icon, misses, status: statusOf(entry, misses, spec) };
        });
        const findings = results.filter((result) => result.icon.new)
          .flatMap((result) => result.misses.map((miss) => ({ ...miss, name: result.icon.name, file: result.icon.file })));
        let app = null;
        const data = {
          results, spec, findings, drawn: icons.filter((icon) => icon.new).length,
          copySpec: () => specMarkdown(spec, measured),
          copyFindings: () => findingsText(findings),
          async addIcon(name, markup) {
            const svg = parse(markup ?? "");
            if (!svg) return null;
            const added = results.filter((result) => result.icon.added).length;
            const icon = { name: name.trim() || `Pasted ${added + 1}`, svg: svg.outerHTML, new: true, added: true, file: "Pasted" };
            const entry = await measure(icon);
            const misses = lint(entry, spec);
            const result = { entry, icon, misses, status: statusOf(entry, misses, spec) };
            results.push(result);
            findings.push(...misses.map((miss) => ({ ...miss, name: icon.name, file: icon.file })));
            app.refresh();
            return result;
          },
        };
        app = createApp($("app"), data);
        window.__icons = { spec, measured, findings, specMarkdown: () => specMarkdown(spec, measured) };
      })();
    </script>
  </body>
</html>
