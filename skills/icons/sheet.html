<!doctype html>
<!--
  Icon sheet. Copy this file to .icons/<set>/index.html and write sheet.js beside it:

  window.sheet = {
    title: "Board Icons",
    source: "skills/gather/board.html",
    sizes: [16, 20, 24, 48],
    icons: [
      { name: "Bookmark", file: "skills/gather/board.html:1333", svg: "<svg viewBox=\"0 0 16 16\" ...>...</svg>" },
      { name: "Search", file: "skills/gather/board.html:1406", svg: "<svg ...>...</svg>", new: true },
      { name: "Pond", file: "skills/gather/board.html:1411", svg: "<svg ...>...</svg>", brand: true }
    ]
  };

  Paste each icon's markup exactly as the project ships it. Names take Title Case. Mark drawn glyphs `new: true`
  and logos `brand: true`. Brand marks are listed but never measured. `sizes` is optional.

  The sheet measures every existing icon, derives the spec from the whole set and lints each icon against it.
  An existing icon off the spec is an outlier, not a finding. New icons are also checked for the morph form.
  The grid filters by view, style and size. Review shows Pixels, Weight and Morph. Clicking an icon opens a dialog
  to inspect, customise, morph and copy prompts. Copy Spec writes icon-spec.md. Copy Findings lists what the new
  icons miss. Icons pasted or dropped on the page are measured and linted for that session only.
-->

      /* App shell */
      .app { position: relative; display: grid; grid-template-columns: 208px 1fr; height: 100vh; overflow: hidden; }

      .stage[data-theme="light"] { background: #f2f2f2; }

      .stage-count { font-size: 13px; color: var(--ink-quiet); font-variant-numeric: tabular-nums; }
      .stage-view { position: relative; display: grid; place-items: center; padding: 0 24px 34px; }
      .stage:has(.timeline:not([hidden])) .stage-view { padding-bottom: 0; }
      .timeline {
        display: flex; align-items: center; gap: 6px; height: 52px; margin: 0 10px 10px; padding: 0 8px;
        font-size: 13px; color: var(--ink-quiet); background: var(--raised); border: 1px solid transparent; border-radius: 14px;

      .timeline[hidden] { display: none; }

      .timeline .segmented { flex: none; background: color-mix(in oklab, var(--ink) 6%, transparent); }
      .timeline .segmented button { height: 22px; padding: 0 8px; color: var(--ink-quiet); }
      .timeline .segmented button[aria-pressed="true"] { color: var(--ink); background: var(--raised); box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgb(0 0 0 / 0.06); }
      .steps { flex: 1; display: flex; align-items: center; min-width: 0; padding: 6px 4px; overflow-x: auto; scrollbar-width: none; }
      .step-wrap { position: relative; flex: none; }
      .step { display: grid; place-items: center; width: 32px; height: 32px; color: var(--ink); background: var(--raised); border-radius: 8px; box-shadow: 0 0 0 1px var(--line); transition: box-shadow 150ms var(--ease-out); }

      .step-remove::before { position: absolute; inset: -4px; content: ""; }
      .step-remove svg { width: 10px; height: 10px; }
      .step-wrap:hover .step-remove, .step:focus-visible + .step-remove { opacity: 1; }
      @media (hover: none) { .step-remove { opacity: 1; } }
      .step-link { position: relative; flex: 1 1 0; display: grid; align-items: center; min-width: 28px; max-width: 120px; height: 32px; padding: 0 4px; }
      .step-line { position: relative; display: block; height: 2px; overflow: hidden; background: color-mix(in oklab, var(--ink) 14%, transparent); border-radius: 1px; }
      .step-link[data-kind="fade"] .step-line { background: repeating-linear-gradient(90deg, color-mix(in oklab, var(--ink) 24%, transparent) 0 3px, transparent 3px 6px); }
      .step-fill { position: absolute; inset: 0 auto 0 0; background: var(--ink); }

      .step-link[data-kind="spin"] .step-kind, .step-link[data-kind="drawn"] .step-kind { color: var(--ink); }
      .step-link[aria-pressed="true"] .step-kind { box-shadow: 0 0 0 1px color-mix(in oklab, var(--ink) 24%, transparent); }
      .picker {
        position: absolute; right: 10px; bottom: 70px; z-index: 1; display: grid; grid-template-columns: repeat(6, 36px); gap: 4px;
        max-height: 240px; padding: 8px; overflow: auto; color: var(--ink); background: var(--raised); border: 1px solid transparent; border-radius: 12px;
        box-shadow: 0 0 0 1px var(--line), 0 4px 12px rgb(0 0 0 / 0.08), 0 12px 32px rgb(0 0 0 / 0.1);
      }
      .picker[hidden] { display: none; }
      .picker-item { display: grid; place-items: center; width: 36px; height: 36px; color: var(--ink); border-radius: 8px; }
      .picker-item:hover { background: color-mix(in oklab, var(--ink) 6%, transparent); }
      .picker-item:disabled { opacity: 0.35; cursor: default; }
      .transition { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; font-size: 13px; text-align: left; }
      .stage-glyph { position: relative; display: grid; width: var(--size); height: var(--size); }
      .stage-glyph > * { grid-area: 1 / 1; width: var(--size) !important; height: var(--size) !important; }
      .keylines { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 200ms var(--ease-out); }
      .keylines[data-on] { opacity: 1; }
      .panel { display: flex; flex-direction: column; gap: 14px; min-height: 0; overflow: hidden; padding: 16px; background: var(--background-raised); border-radius: 16px; box-shadow: var(--shadow-large); }
      .panel-head { display: flex; align-items: center; gap: 8px; }
      .panel-title { min-width: 0; overflow: hidden; font-variation-settings: var(--font-weight-500); white-space: nowrap; text-overflow: ellipsis; }
      .panel-head .icon-button { margin: -6px -6px -6px auto; }
      .chip { display: inline-flex; flex: none; align-items: center; height: 20px; white-space: nowrap; padding: 0 7px; font-size: 12px; font-variation-settings: var(--font-weight-500); border-radius: 6px; background: var(--background-tertiary); color: var(--text-tertiary); }
      .chip[data-status="Fails"], .chip[data-status="Outlier"] { color: var(--danger); background: color-mix(in oklab, var(--danger) 12%, transparent); }

      .segmented button[aria-pressed="true"] { color: var(--text-primary); background: var(--background-raised); box-shadow: var(--shadow-default); }

      .slider { cursor: ew-resize; touch-action: none; user-select: none; }

      .color-input::-webkit-color-swatch-wrapper { padding: 0; }
      .color-input::-webkit-color-swatch { border: 0; opacity: 0; }
      .controls { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .live-note { font-size: 13px; color: var(--text-tertiary); }
      .select, .input { width: 100%; min-width: 0; height: 28px; padding: 0 9px; font-size: 13px; color: var(--text-primary); background: var(--background-control); border: 1px solid transparent; border-radius: var(--radius-control); box-shadow: var(--shadow-default); outline: none; }

      .disclosure summary { width: fit-content; font-size: 13px; color: var(--text-tertiary); cursor: pointer; }
      .disclosure summary:hover { color: var(--text-primary); }
      .paste { display: grid; gap: 8px; margin-top: 10px; }
      .paste .button { justify-self: end; }
      .prompt { display: grid; gap: 10px; padding: 12px; background: var(--background-tertiary); border-radius: 10px; }

      .prompt-note { font-size: 13px; color: var(--text-tertiary); }

      /* Review views and the measurements table */
      .tiles[data-large] { grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); }
      .tiles[data-large] .tile-name { opacity: 1; }

      .spec-view .card-wide { grid-column: 1 / -1; }
      .card-note { margin: -4px 0 12px; font-size: 13px; color: var(--text-tertiary); }
      .card-head .card-note { margin: 0; font-variation-settings: var(--font-weight-400); }
      .table { display: grid; grid-template-columns: minmax(0, 1.6fr) repeat(4, minmax(0, 1fr)) auto; column-gap: 16px; font-size: 13px; }
      .table-row { display: grid; grid-column: 1 / -1; grid-template-columns: subgrid; align-items: baseline; padding: 7px 0; }
      .table-row + .table-row { box-shadow: 0 -1px 0 var(--border-primary); }
      .table-head { color: var(--text-quaternary); }
      .link { text-align: left; text-decoration: underline; text-decoration-color: var(--border-secondary); text-underline-offset: 3px; }
      .link:hover { text-decoration-color: currentColor; }
      .status { justify-self: end; color: var(--text-tertiary); white-space: nowrap; }

      .verdict-body { display: grid; gap: 6px; }

    </style>
  </head>
  <body>
    <div id="app"></div>

    <script>
      document.write(`<script src="sheet.js?${Date.now()}"><\/script>`);
    </script>
    <script>
      const sheet = window.sheet;
      const $ = (id) => document.getElementById(id);
      const SIZES = sheet.sizes ?? [16, 20, 24, 48];
      const GRID_STEPS = [1, 0.5, 0.25, 0.125];
      const ALLOWED = new Set(["svg", "path", "line", "polyline", "polygon", "rect", "circle", "ellipse"]);
      const GEOMETRY = ["x", "y", "width", "height", "rx", "ry", "cx", "cy", "r", "x1", "y1", "x2", "y2"];
      const COVERAGE_SCALE = 10;

      function h(tag, props = {}, ...children) {
        const node = document.createElement(tag);
        for (const [key, value] of Object.entries(props)) {
          if (key === "html") node.innerHTML = value;
          else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
          else node.setAttribute(key, value);
        }
        node.append(...children.filter((child) => child != null));
        return node;
      }

      function parse(markup) {
        const template = document.createElement("template");
        template.innerHTML = markup.trim();
        return template.content.querySelector("svg");
      }

      function sized(markup, size) {
        const svg = parse(markup).cloneNode(true);
        svg.setAttribute("width", size);
        svg.setAttribute("height", size);
        svg.setAttribute("aria-hidden", "true");
        return svg;
      }

      const round = (value, step = 0.01) => Math.round(value / step) * step;
      const format = (value) => String(round(value));
      const mode = (values) => {
        const counts = new Map();
        for (const value of values) counts.set(value, (counts.get(value) ?? 0) + 1);
        return [...counts].sort((a, b) => b[1] - a[1])[0]?.[0];
      };

      const workspace = h("div", { "aria-hidden": "true", style: "position:absolute;left:-9999px;top:0" });
      document.body.append(workspace);

      function numbersOf(element) {
        const numbers = [];
        for (const name of GEOMETRY) {
          if (element.hasAttribute(name)) numbers.push(parseFloat(element.getAttribute(name)));
        }
        if (element.hasAttribute("points")) {
          numbers.push(...element.getAttribute("points").trim().split(/[\s,]+/).map(Number));
        }
        if (element.tagName === "path") {
          for (const segment of element.getAttribute("d").match(/[a-z][^a-z]*/gi) ?? []) {
            const values = (segment.slice(1).match(NUMBER) ?? []).map(Number);
            const letter = segment[0].toLowerCase();
            const handles = { c: [6, 4], s: [4, 2], q: [4, 2] }[letter];
            if (letter === "a") numbers.push(...values.filter((_, index) => ![3, 4].includes(index % 7)));
            else if (handles) numbers.push(...values.filter((_, index) => index % handles[0] >= handles[1]));
            else numbers.push(...values);
          }
        }
        return numbers;
      }

      const NUMBER = /-?(?:\d+\.?\d*|\.\d+)(?:e-?\d+)?/gi;

      function morphShape(d) {
        const tokens = d.match(/[a-z]|-?(?:\d+\.?\d*|\.\d+)(?:e-?\d+)?/gi) ?? [];
        if (tokens[0] !== "M" || tokens.length < 3 || isNaN(tokens[1]) || isNaN(tokens[2])) return null;
        let segments = 0;
        for (let index = 3; index < tokens.length; index += 7) {
          if (tokens[index] !== "C" || tokens.slice(index + 1, index + 7).filter((token) => !isNaN(token)).length !== 6) return null;
          segments += 1;
        }
        return segments;
      }

      function morphOf(svg) {
        const painted = [...svg.querySelectorAll("*")];
        const paths = painted.filter((element) => element.tagName === "path");
        const shapes = paths.map((path) => morphShape(path.getAttribute("d")));
        return {
          others: [...new Set(painted.filter((element) => element.tagName !== "path").map((element) => element.tagName))],
          slots: paths.length,
          shapes,
          d: paths.map((path) => path.getAttribute("d")),
        };
      }

      function radiiOf(element) {
        const radii = [];
        if (element.tagName === "rect" && element.hasAttribute("rx")) radii.push(parseFloat(element.getAttribute("rx")));
        if (element.tagName === "path") {
          for (const segment of element.getAttribute("d").match(/a[^a-z]*/gi) ?? []) {
            const values = (segment.slice(1).match(/-?(?:\d+\.?\d*|\.\d+)/g) ?? []).map(Number);
            for (let index = 0; index < values.length; index += 7) radii.push(values[index]);
          }
        }
        return radii;
      }

      const ARITY = { l: 2, t: 2, h: 1, v: 1, c: 6, s: 4, q: 4, a: 7, m: 2 };

      function endsOf(element) {
        const tag = element.tagName;
        if (tag === "line") return { open: true, corners: false };
        if (tag === "polyline") return { open: true, corners: element.points.length > 2 };
        if (tag === "polygon") return { open: false, corners: true };
        if (tag === "rect") return { open: false, corners: !parseFloat(element.getAttribute("rx") || 0) };
        if (tag !== "path") return { open: false, corners: false };
        let open = false;
        let corners = false;
        for (const subpath of element.getAttribute("d").split(/(?=[Mm])/)) {
          let segments = 0;
          for (const command of subpath.match(/[a-z][^a-z]*/gi) ?? []) {
            const letter = command[0].toLowerCase();
            if (letter === "z") continue;
            const values = command.slice(1).match(/-?(?:\d+\.?\d*|\.\d+)/g) ?? [];
            const count = letter === "h" || letter === "v" ? values.length : Math.floor(values.length / ARITY[letter]);
            segments += letter === "m" ? count - 1 : count;
          }
          const closed = /z\s*$/i.test(subpath);
          if (!closed) open = true;
          if (closed || segments > 1) corners = true;
        }
        return { open, corners };
      }

      function edgeKind(element, side, extreme, half) {
        const tag = element.tagName;
        if (tag === "circle" || tag === "ellipse") return "round";
        if (tag === "rect") return parseFloat(element.getAttribute("rx") || 0) * 2 >= parseFloat(element.getAttribute("width")) ? "round" : "straight";
        if (typeof element.getTotalLength !== "function") return "straight";
        const length = element.getTotalLength();
        const step = Math.max(length / 2000, 0.005);
        const axis = side === "left" || side === "right" ? "x" : "y";
        const target = side === "left" || side === "top" ? extreme + half : extreme - half;
        let run = 0;
        let atEnd = false;
        let previous = null;
        for (let at = 0; at <= length; at += step) {
          const point = element.getPointAtLength(at);
          const jump = previous && Math.hypot(point.x - previous.x, point.y - previous.y) > step * 4;
          if (Math.abs(point[axis] - target) < 0.02) {
            run += step;
            if (at === 0 || at + step > length || jump) atEnd = true;
          }
          previous = point;
        }
        if (atEnd && run < 0.2) return "cap";
        return run < 1.5 ? "round" : "straight";
      }

      function coverage(markup, viewBox) {
        const width = viewBox[2] * COVERAGE_SCALE;
        const height = viewBox[3] * COVERAGE_SCALE;
        const svg = sized(markup, width);
        svg.setAttribute("height", height);
        svg.setAttribute("xmlns", "http://www.w3.org/2000/svg");
        const source = svg.outerHTML.replaceAll("currentColor", "#000");
        return new Promise((resolve) => {
          const image = new Image();
          image.onload = () => {
            const canvas = h("canvas", { width, height });
            const context = canvas.getContext("2d", { willReadFrequently: true });
            context.drawImage(image, 0, 0);
            const data = context.getImageData(0, 0, width, height).data;
            let ink = 0;
            for (let index = 3; index < data.length; index += 4) ink += data[index] / 255;
            resolve(ink / (width * height));
          };
          image.onerror = () => resolve(null);
          image.src = `data:image/svg+xml,${encodeURIComponent(source)}`;
        });
      }

      async function measure(icon) {
        const svg = sized(icon.svg, 16);
        workspace.append(svg);
        const viewBox = (svg.getAttribute("viewBox") ?? "0 0 16 16").split(/[\s,]+/).map(Number);
        const elements = [...svg.querySelectorAll("*")];
        const painted = elements.filter((element) => element.getBBox && !["g", "defs", "title", "desc"].includes(element.tagName));
        const style = (element, name) => getComputedStyle(element).getPropertyValue(name);
        const strokes = painted.filter((element) => style(element, "stroke") !== "none");
        const fills = painted.filter((element) => style(element, "fill") !== "none");
        const stroke = strokes.length ? parseFloat(style(strokes[0], "stroke-width")) : 0;
        const edges = { left: [Infinity], top: [Infinity], right: [-Infinity], bottom: [-Infinity] };
        for (const element of painted) {
          const box = element.getBBox();
          const half = style(element, "stroke") === "none" ? 0 : parseFloat(style(element, "stroke-width")) / 2;
          const sides = { left: box.x - half, top: box.y - half, right: box.x + box.width + half, bottom: box.y + box.height + half };
          for (const side of ["left", "top"]) if (sides[side] < edges[side][0]) edges[side] = [sides[side], element, half];
          for (const side of ["right", "bottom"]) if (sides[side] > edges[side][0]) edges[side] = [sides[side], element, half];
        }
        const insets = {
          left: edges.left[0] - viewBox[0],
          top: edges.top[0] - viewBox[1],
          right: viewBox[0] + viewBox[2] - edges.right[0],
          bottom: viewBox[1] + viewBox[3] - edges.bottom[0],
        };
        const tightest = Object.entries(insets).sort((a, b) => a[1] - b[1])[0];
        const [, edgeElement, edgeHalf] = edges[tightest[0]];
        const edge = edgeKind(edgeElement, tightest[0], edges[tightest[0]][0], edgeHalf);
        const numbers = painted.flatMap(numbersOf);
        const ends = strokes.map(endsOf);
        const pixel = painted.length >= 6 && !strokes.length && numbers.every((value) => Number.isInteger(value)) &&
          painted.every((element) => element.tagName === "rect" && !element.hasAttribute("rx"));
        const result = {
          icon,
          viewBox: viewBox.join(" "),
          kind: pixel ? "Pixel" : strokes.length ? (fills.length ? "Filled" : "Outline") : "Filled",
          stroke,
          caps: ends.some((end) => end.open) ? style(strokes[0], "stroke-linecap") : null,
          joins: ends.some((end) => end.corners) ? style(strokes[0], "stroke-linejoin") : null,
          inset: tightest[1],
          edge,
          numbers,
          radii: painted.flatMap(radiiOf),
          tags: [...new Set(elements.map((element) => element.tagName))],
          decimals: Math.max(0, ...(icon.svg.match(/\d\.\d+/g) ?? []).map((value) => value.split(".")[1].length)),
          transform: /\stransform=/.test(icon.svg),
          hex: /#[0-9a-f]{3,8}\b|rgb\(/i.test(icon.svg),
          ids: /\s(id|class|style)=/.test(icon.svg),
          masks: elements.some((element) => ["clipPath", "mask", "filter", "image", "text", "use"].includes(element.tagName)) ||
            /\s(clip-path|mask|filter)=/.test(icon.svg),
          coverage: await coverage(icon.svg, viewBox),
          morph: morphOf(svg),
        };
        svg.remove();
        return result;
      }

      const onStep = (value, step) => Math.abs(value / step - Math.round(value / step)) < 1e-6;

      function gridOf(entries) {
        if (!entries.length) return 0.5;
        for (const step of GRID_STEPS) {
          const on = entries.filter((entry) => entry.numbers.every((value) => onStep(value, step))).length;
          if (on / entries.length >= 0.8) return step;
        }
        return GRID_STEPS.at(-1);
      }

      function derive(measured) {
        const existing = measured.filter((entry) => !entry.icon.new);
        const viewBox = mode(existing.map((entry) => entry.viewBox));
        const base = existing.filter((entry) => entry.viewBox === viewBox);
        const outline = base.filter((entry) => entry.kind === "Outline");
        const insets = base.map((entry) => round(entry.inset, 0.25));
        const padding = mode(insets.filter((value) => value >= 0)) ?? 0;
        const roundEdges = base.filter((entry) => entry.edge === "round" && entry.inset < padding);
        const overshoot = roundEdges.length ? Math.max(...roundEdges.map((entry) => padding - entry.inset)) : 0;
        const ranges = {};
        for (const entry of base) {
          if (entry.coverage == null) continue;
          const range = (ranges[entry.kind] ??= [Infinity, -Infinity]);
          range[0] = Math.min(range[0], entry.coverage);
          range[1] = Math.max(range[1], entry.coverage);
        }
        const drawn = measured.filter((entry) => entry.icon.new);
        return {
          morph: {
            slots: Math.max(0, ...drawn.map((entry) => entry.morph.slots)),
            segments: Math.max(0, ...drawn.flatMap((entry) => entry.morph.shapes.filter(Boolean))),
          },
          count: base.length,
          viewBox,
          stroke: mode(outline.map((entry) => entry.stroke)) ?? 0,
          caps: mode(outline.map((entry) => entry.caps).filter(Boolean)),
          joins: mode(outline.map((entry) => entry.joins).filter(Boolean)),
          radii: [...new Set(base.flatMap((entry) => entry.radii))].sort((a, b) => a - b),
          grid: gridOf(base),
          padding,
          overshoot: round(overshoot, 0.25),
          ranges,
          tags: [...new Set(base.flatMap((entry) => entry.tags))].filter((tag) => ALLOWED.has(tag)),
        };
      }

      function lint(entry, spec) {
        const misses = [];
        const add = (rule, text) => misses.push({ rule, text });
        const offGrid = [...new Set(entry.numbers.filter((value) => !onStep(value, spec.grid)))];
        const blocked = entry.tags.filter((tag) => !ALLOWED.has(tag));
        if (entry.viewBox !== spec.viewBox) add("icons-lint-the-spec", `viewBox ${entry.viewBox}, the set uses ${spec.viewBox}`);
        if (entry.kind !== "Pixel" && entry.stroke && entry.stroke !== spec.stroke) add("icons-lint-the-spec", `stroke ${entry.stroke}, the set uses ${spec.stroke}`);
        if (entry.caps && spec.caps && entry.caps !== spec.caps) add("icons-lint-the-spec", `${entry.caps} caps, the set uses ${spec.caps}`);
        if (entry.joins && spec.joins && entry.joins !== spec.joins) add("icons-lint-the-spec", `${entry.joins} joins, the set uses ${spec.joins}`);
        if (offGrid.length) add("icons-on-the-grid", `${offGrid.slice(0, 6).join(", ")} off the ${spec.grid} grid`);
        if (entry.hex) add("icons-on-the-grid", "a literal colour, not currentColor");
        if (blocked.length) add("icons-on-the-grid", `${blocked.join(", ")} element`);
        const floor = entry.edge === "round" ? spec.padding - spec.overshoot : spec.padding;
        if (entry.inset < floor - 1e-6) add("icons-lint-the-spec", `ink ${format(entry.inset)} from the edge, the floor is ${format(floor)} for a ${entry.edge} edge`);
        const strays = entry.radii.filter((value) => spec.radii.length && !spec.radii.includes(value));
        if (strays.length) add("icons-lint-the-spec", `radius ${[...new Set(strays)].join(", ")}, the set uses ${spec.radii.join(", ")}`);
        const range = spec.ranges[entry.kind];
        if (range && entry.coverage != null && (entry.coverage < range[0] - 0.005 || entry.coverage > range[1] + 0.005)) {
          add("icons-lint-the-spec", `${percent(entry.coverage)} ink, ${entry.kind.toLowerCase()} icons in the set run ${percent(range[0])} to ${percent(range[1])}`);
        }
        if (entry.decimals > 3) add("icons-lint-the-spec", `${entry.decimals} decimals, the limit is 3`);
        if (entry.transform) add("icons-lint-the-spec", "a transform");
        if (entry.ids || entry.masks) add("icons-lint-the-spec", "an id, class, style, mask or clip path");
        if (entry.icon.new) {
          const { others, slots, shapes } = entry.morph;
          const { slots: wanted, segments } = spec.morph;
          if (others.length) add("icons-morph-form", `${others.join(", ")} element, the morph form is paths only`);
          if (slots !== wanted) add("icons-morph-form", `${slots} paths, every new icon has ${wanted}`);
          if (shapes.some((shape) => shape === null)) add("icons-morph-form", "a path that is not M followed by explicit C segments");
          const counts = [...new Set(shapes.filter(Boolean))].filter((count) => count !== segments);
          if (counts.length) add("icons-morph-form", `${counts.join(", ")} segments in a path, every path has ${segments}`);
        }
        return misses;
      }

      const percent = (value) => `${(value * 100).toFixed(1)}%`;

      function statusOf(entry, misses, spec) {
        if (misses.length) return entry.icon.new ? "Fails" : "Outlier";
        if (entry.icon.new && !spec.ranges[entry.kind]) return "Not Verified";
        return "Pass";
      }

      function rasterise(markup, viewBox, color) {
        const [, , width, height] = viewBox.split(" ").map(Number);
        const svg = sized(markup, width);
        svg.setAttribute("height", height);
        svg.setAttribute("xmlns", "http://www.w3.org/2000/svg");
        const canvas = h("canvas", { width, height, style: `width:${width * 3}px;height:${height * 3}px` });
        const image = new Image();
        image.onload = () => canvas.getContext("2d").drawImage(image, 0, 0);
        image.src = `data:image/svg+xml,${encodeURIComponent(svg.outerHTML.replaceAll("currentColor", color))}`;
        return canvas;
      }

      function bezier(x1, y1, x2, y2) {
        const at = (t, a, b) => 3 * a * t * (1 - t) ** 2 + 3 * b * t * t * (1 - t) + t ** 3;
        return (x) => {
          let low = 0;
          let high = 1;
          for (let step = 0; step < 24; step += 1) {
            const mid = (low + high) / 2;
            if (at(mid, x1, x2) < x) low = mid;
            else high = mid;
          }
          return at((low + high) / 2, y1, y2);
        };
      }

      const easeInOut = bezier(0.77, 0, 0.175, 1);
      const reduced = matchMedia("(prefers-reduced-motion: reduce)");
      const MORPH_MS = 240;
      const HOLD_MS = 1200;
      function specLines(spec) {
