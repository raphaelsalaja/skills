        severity: "HIGH",
        title: "Reset Does Nothing",
        rules: ["verify-click-new-controls"],
        skills: ["verify"],
        locations: ["settings/index.tsx:42"],
        evidence: "Clicked Reset in Settings and no value changed.",
        fix: "Call the store's reset from the Reset handler."
      }
    ],
    notVerified: ["Export, it needs a signed build"]
  };

  `verdict` is "Block" when any HIGH remains and "Approve" otherwise. `severity` is HIGH, MEDIUM or LOW. Number findings in rank order: severity, then reach. A location is file:line, or "request 2" when no file applies. Each skill has `checked` with what was inspected, or `skipped` with the reason. `notVerified` lists every check that could not run, or stays empty. Titles take Title Case, such as "Reset Does Nothing".

        }

        dt {
          flex: none;
          color: var(--text-tertiary);
        }

        dd {
          min-width: 0;
          text-align: right;
          overflow-wrap: anywhere;
          font-variant-numeric: tabular-nums;

          span + span::before {
            content: ", ";
          }
        }

        a {
          display: inline-flex;
          gap: 4px;
          align-items: center;

          svg {
            color: var(--text-quaternary);
          }

          &:active svg {
            color: var(--text-primary);
          }
        }

        &[data-stacked] {
          flex-direction: column;
          gap: 2px;

          dd {
            text-align: left;
          }
        }
      }

      @media (hover: hover) and (pointer: fine) {
        .detail a:hover svg {
          color: var(--text-primary);
        }
      }
      /* kit:panel end */

      /* kit:section */
      .section-head {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
        align-items: baseline;
        margin-bottom: 20px;

        .count {
          margin-left: auto;
        }
      }

      .section-title {
        font-variation-settings: var(--font-weight-500);
      }

      .section-description {
        color: var(--text-tertiary);
      }

      .rows > * + * {
        border-top: 1px solid var(--border-primary);
      }

      .empty {
        padding: 64px 0;
        color: var(--text-tertiary);
        text-align: center;
      }
      /* kit:section end */

      .page {
        width: min(768px, 100% - var(--inset) * 2);
        margin: 0 auto;
        padding: 96px 0 128px;

        @media (width <= 640px) {
          --inset: 24px;
          padding-top: 64px;
        }
      }

      .bar {
        margin-top: 48px;
      }

      .filters,
      .picks {
        display: flex;
        gap: 8px;
        min-width: 0;
      }

      .picks {
        margin-left: auto;
      }

      .sections {
        display: flex;
        flex-direction: column;
        gap: 64px;
        margin-top: 32px;
      }

      .finding {
        position: relative;
        display: flex;
        gap: 12px;
        align-items: flex-start;
        padding: 10px 12px;
        margin: 0 -12px;
        border-radius: var(--radius-menu);

        &:active {
          background: var(--fill-hover);
        }

        &[data-current] {
          background: var(--background-tertiary);
        }
      }

      .finding-n {
        flex: none;
        min-width: 20px;
        padding-top: 4px;
        color: var(--text-quaternary);
        font-variant-numeric: tabular-nums;
      }

      .finding-body {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
        padding-top: 4px;
      }

      .finding-open {
        text-align: left;
        text-wrap: pretty;

        &::after {
          position: absolute;
          inset: 0;
          content: "";
          border-radius: var(--radius-menu);
        }

        &:focus-visible {
          outline: none;

          &::after {
            outline: 2px solid var(--accent);
          }
        }
      }

      .finding-where {
        font-size: 13px;
        color: var(--text-tertiary);
        overflow-wrap: anywhere;
      }

      .pick {
        z-index: 1;
      }

      .skill {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 2px 16px;
        padding: 10px 0;
      }

      .skill-name {
        font-variation-settings: var(--font-weight-500);
      }

      .skill-result {
        color: var(--text-tertiary);
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      .skill-checked {
        grid-column: 1 / -1;
        color: var(--text-tertiary);
      }

      .gap {
        padding: 10px 0;
        color: var(--text-secondary);
      }

      @media (hover: hover) and (pointer: fine) {
        .finding:hover:not([data-current]) {
          background: var(--fill-hover);
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="head">
        <h1 class="title" id="title"></h1>
        <p class="brief" id="scope"></p>
      </header>

      <nav class="bar" id="bar" aria-label="Filters">
        <div class="filters">
          <select class="select" id="severity-filter" aria-label="Severity"></select>
          <select class="select" id="skill-filter" aria-label="Skill"></select>
        </div>
        <div class="picks">
          <button class="action" id="copy" type="button" title="Copy Picks (⇧C)" aria-keyshortcuts="Shift+C" disabled>Copy Picks</button>
        </div>
      </nav>

      <main class="sections" id="sections"></main>
    </div>

    <dialog class="sheet" id="panel" aria-labelledby="panel-title">
      <div class="panel-scroll scroll-fade">
        <div class="panel-top">
          <button class="icon-button" id="panel-close" type="button" aria-label="Close" title="Close (Esc)">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8" /></svg>
          </button>
          <div class="panel-tools">
            <button class="icon-button" id="panel-pick" type="button" aria-pressed="false"></button>
            <button class="icon-button" id="panel-prev" type="button" aria-label="Previous" title="Previous (K)">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12.5v-9M4.5 7L8 3.5 11.5 7" /></svg>
            </button>
            <button class="icon-button" id="panel-next" type="button" aria-label="Next" title="Next (J)">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3.5v9M4.5 9L8 12.5 11.5 9" /></svg>
            </button>
          </div>
        </div>
        <header class="panel-head">
          <span class="panel-group" id="panel-group"></span>
          <h2 class="panel-title" id="panel-title"></h2>
          <p class="panel-note" id="panel-note"></p>
          <span class="panel-count" id="panel-count"></span>
        </header>
        <dl id="panel-details"></dl>
      </div>
    </dialog>

    <script src="report.js"></script>
    <script>
      // kit:h
      const $ = (id) => document.getElementById(id);

      function h(tag, props = {}, ...children) {
        const node = document.createElement(tag);
        for (const [key, value] of Object.entries(props)) {
          if (key === "html") node.innerHTML = value;
          else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
          else node.setAttribute(key, value);
        }
        node.append(...children.filter((child) => child != null));
        return node;
      }
      // kit:h end

      // kit:anchor
      function anchorTo(popover, anchor) {
        const rect = anchor.getBoundingClientRect();
        const frame = (anchor.closest("[data-frame]") ?? anchor).getBoundingClientRect();
        const half = popover.offsetWidth / 2;
        const edge = document.documentElement.clientWidth - 8;
        const below = frame.top < popover.offsetHeight + 16;
        popover.style.left = `${Math.min(edge - half, Math.max(8 + half, rect.left + rect.width / 2))}px`;
        popover.style.top = `${below ? frame.bottom + 8 : frame.top - 8 - popover.offsetHeight}px`;
        popover.dataset.side = below ? "below" : "above";
      }
      // kit:anchor end

      // kit:overlays
      const toast = h("output", { class: "toast", popover: "manual" });
      const tip = h("div", { class: "tip", popover: "manual", "aria-hidden": "true" });
      document.body.append(toast, tip);

      function hideToast() {
        clearTimeout(toast.hide);
        delete toast.dataset.open;
        toast.hide = setTimeout(() => toast.hidePopover(), 200);
      }

      function showToast(anchor, message, action) {
        clearTimeout(toast.hide);
        hideTip();
        delete toast.dataset.open;
        if (!toast.matches(":popover-open")) toast.showPopover();
        toast.replaceChildren(message, ...(action ? [action] : []));
        anchorTo(toast, anchor);
        toast.dataset.open = "";
        toast.hide = setTimeout(hideToast, action ? 5000 : 1600);
      }

      async function copy(text, anchor) {
        const tokens = Math.ceil(text.length / 4).toLocaleString();
        const message = await navigator.clipboard.writeText(text).then(
          () => `Copied · ~${tokens} tokens`,
          () => "Copy Failed",
        );
        showToast(anchor, message);
      }

      let tipTimer;
      let tipClosedAt = 0;

      function showTip(button) {
        clearTimeout(tipTimer);
        const warm = tip.matches(":popover-open") || performance.now() - tipClosedAt < 300;
        const open = () => {
          const key = button.dataset.key;
          tip.replaceChildren(button.dataset.tip || button.getAttribute("aria-label"), ...(key ? [h("kbd", {}, key)] : []));
          tip.toggleAttribute("data-instant", warm);
          if (!tip.matches(":popover-open")) tip.showPopover();
          anchorTo(tip, button);
        };
        if (warm) open();
        else tipTimer = setTimeout(open, 500);
      }

      function hideTip() {
        clearTimeout(tipTimer);
        if (!tip.matches(":popover-open")) return;
        tipClosedAt = performance.now();
        tip.hidePopover();
      }

      const tipped = (event) => event.target.closest?.("[data-tip]");
      document.addEventListener("pointerover", (event) => {
        const button = tipped(event);
        if (button && event.pointerType === "mouse" && !button.contains(event.relatedTarget)) showTip(button);
      });
      document.addEventListener("pointerout", (event) => {
        const button = tipped(event);
        if (button && !button.contains(event.relatedTarget)) hideTip();
      });
      document.addEventListener("focusin", (event) => {
        const button = tipped(event);
        if (button?.matches(":focus-visible")) showTip(button);
      });
      document.addEventListener("focusout", (event) => tipped(event) && hideTip());
      document.addEventListener("pointerdown", hideTip);
      // kit:overlays end

      // kit:bar
      function stick(bar) {
        const mark = () => bar.toggleAttribute("data-stuck", scrollY > 0 && bar.getBoundingClientRect().top <= 0);
        addEventListener("scroll", mark, { passive: true });
        mark();
        new ResizeObserver(() => {
          document.documentElement.style.setProperty("--bar-height", `${bar.offsetHeight + 8}px`);
        }).observe(bar);
      }
      // kit:bar end

      const audit = window.audit;
      const storageKey = `audit:${location.pathname}`;
      const picked = new Set(JSON.parse(localStorage.getItem(storageKey) || "[]"));
      const filters = { severity: null, skill: null };

      const check = `<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7" /></svg>`;

      const levels = [
        { key: "HIGH", label: "High", title: "High Severity", description: "Breaks behaviour or loses work." },
        { key: "MEDIUM", label: "Medium", title: "Medium Severity", description: "Visible and inconsistent." },
        { key: "LOW", label: "Low", title: "Low Severity", description: "Polish." },
      ];
      const levelOf = Object.fromEntries(levels.map((level) => [level.key, level]));
      const skillName = (name) => name.charAt(0).toUpperCase() + name.slice(1);
      const list = (parts) => (parts.length < 2 ? parts.join("") : `${parts.slice(0, -1).join(", ")} and ${parts.at(-1)}`);
      const place = (location) => location.replaceAll("/", " › ").replace(/^request\b/, "Request");

      function places(locations) {
        const files = new Map();
        for (const location of locations) {
          const [, file, line] = location.match(/^(.+?):(\d+)$/) ?? [, location, null];
          if (!files.has(file)) files.set(file, []);
          if (line) files.get(file).push(line);
        }
        return [...files].map(([file, lines]) => place(lines.length ? `${file}:${lines.join(", ")}` : file)).join(" · ");
      }

      const findings = [...audit.findings].sort((a, b) => a.n - b.n);
      const identity = (finding) => `${finding.n} ${finding.title}`;
      const skillOrder = [...new Set([...audit.skills.map((skill) => skill.name), ...findings.flatMap((finding) => finding.skills)])];
      const owners = skillOrder.filter((name) => findings.some((finding) => finding.skills.includes(name)));

      const highs = findings.filter((finding) => finding.severity === "HIGH").length;
      $("title").textContent = highs ? `${audit.verdict}, ${highs} High` : audit.verdict;
      $("scope").textContent = audit.scope;
      document.title = `${audit.verdict} · Audit`;

      function isVisible(finding) {
        return (
          (filters.severity === null || finding.severity === filters.severity) &&
          (filters.skill === null || finding.skills.includes(filters.skill))
        );
      }

      function option(value, label, count) {
        return h("option", { value }, label, " ", h("span", { class: "count" }, String(count)));
      }

      $("severity-filter").append(
        option("", "All Severities", findings.length),
        ...levels
          .map((level) => [level, findings.filter((finding) => finding.severity === level.key).length])
          .filter(([, count]) => count > 0)
          .map(([level, count]) => option(level.key, level.label, count)),
      );
      $("skill-filter").append(
        option("", "All Skills", findings.length),
        ...owners.map((name) =>
          option(name, skillName(name), findings.filter((finding) => finding.skills.includes(name)).length),
        ),
      );
      $("severity-filter").addEventListener("change", (event) => setFilter("severity", event.target.value || null));
      $("skill-filter").addEventListener("change", (event) => setFilter("skill", event.target.value || null));

      function setFilter(key, value) {
        filters[key] = value;
        if (current && !isVisible(current)) setCurrent(null);
        render();
        writeHash();
      }

      const sections = levels.map((level) => {
        const rows = h("ol", { class: "findings" });
        const node = h(
          "section",
          { class: "section" },
          h(
            "header",
            { class: "section-head" },
            h("h2", { class: "section-title" }, level.title),
            h("p", { class: "section-description" }, level.description),
          ),
          rows,
        );
        $("sections").append(node);
        return { level, node, rows };
      });
      const empty = h("p", { class: "empty", hidden: "" }, findings.length ? "No Findings Match" : "No Findings");
      $("sections").append(empty);

      for (const finding of findings) {
        finding.pick = h("button", {
          class: "pick",
          type: "button",
          html: check,
          onclick: () => togglePick(finding),
        });
        finding.open = h(
          "button",
          { class: "finding-open", type: "button", onclick: () => openPanel(finding) },
          finding.title,
        );
        finding.node = h(
          "li",
          { class: "finding" },
          h("span", { class: "finding-n" }, String(finding.n)),
          h(
            "div",
            { class: "finding-body" },
            finding.open,
            h("span", { class: "finding-where" }, places(finding.locations)),
          ),
          finding.pick,
        );
        sections.find((section) => section.level.key === finding.severity).rows.append(finding.node);
        renderPick(finding);
      }

      const coverage = h("div", { class: "rows" });
      for (const skill of audit.skills) {
        const numbers = findings.filter((finding) => finding.skills.includes(skill.name)).map((finding) => String(finding.n));
        const result = skill.skipped
          ? "Skipped"
          : numbers.length
            ? `${numbers.length === 1 ? "Finding" : "Findings"} ${list(numbers)}`
            : "Clean";
        coverage.append(
          h(
            "div",
            { class: "skill" },
            h("span", { class: "skill-name" }, skillName(skill.name)),
            h("span", { class: "skill-result" }, result),
            h("p", { class: "skill-checked" }, skill.skipped ?? skill.checked),
          ),
        );
      }
      $("sections").append(
        h(
          "section",
          { class: "section" },
          h(
            "header",
            { class: "section-head" },
            h("h2", { class: "section-title" }, "Skill Coverage"),
            h("p", { class: "section-description" }, "What each skill checked, or why it was skipped."),
          ),
          coverage,
        ),
      );

      if (audit.notVerified.length) {
        $("sections").append(
          h(
            "section",
            { class: "section" },
            h(
              "header",
              { class: "section-head" },
              h("h2", { class: "section-title" }, "Not Verified"),
              h("p", { class: "section-description" }, "Checks that could not run, and why."),
            ),
            h("div", { class: "rows" }, ...audit.notVerified.map((gap) => h("p", { class: "gap" }, gap))),
          ),
        );
      }

      function render() {
        let shown = 0;
        for (const finding of findings) {
          finding.node.hidden = !isVisible(finding);
          if (!finding.node.hidden) shown += 1;
        }
        for (const section of sections) {
          section.node.hidden = !findings.some((finding) => finding.severity === section.level.key && isVisible(finding));
        }
        empty.hidden = shown > 0;
      }

      function save() {
        localStorage.setItem(storageKey, JSON.stringify([...picked]));
      }

      function renderPick(finding) {
        const isPicked = picked.has(identity(finding));
        const label = isPicked ? "Unpick" : "Pick";
        finding.pick.setAttribute("aria-pressed", String(isPicked));
        finding.pick.setAttribute("aria-label", `${label} ${finding.n}`);
        finding.pick.title = `${label} (P)`;
      }

      function renderCopy() {
        $("copy").disabled = !findings.some((finding) => picked.has(identity(finding)));
      }

      function togglePick(finding) {
        const key = identity(finding);
        if (picked.has(key)) picked.delete(key);
        else picked.add(key);
        save();
        renderPick(finding);
        renderCopy();
        if (panel.open && current === finding) renderPanel();
      }

      stick($("bar"));

      function reportLine(finding) {
        return `${finding.n}. ${finding.severity}  ${finding.locations.join(", ")} - [${finding.rules.join(", ")}] ${finding.title}`;
      }

      function copyPicks() {
        const picks = findings.filter((finding) => picked.has(identity(finding)));
        if (picks.length === 0) return;
        copy(`Fix ${list(picks.map((finding) => String(finding.n)))}\n\n${picks.map(reportLine).join("\n")}\n`, $("copy"));
      }

      $("copy").addEventListener("click", copyPicks);

      const panel = $("panel");
      let current = null;

      function setCurrent(finding) {
        current?.node.removeAttribute("data-current");
        current = finding;
        current?.node.setAttribute("data-current", "");
      }

      function select(finding) {
        setCurrent(finding);
        if (panel.open) {
          renderPanel();
          writeHash();
        } else {
          finding.open.focus({ preventScroll: true });
        }
        finding.node.scrollIntoView({ block: "nearest" });
      }

      function step(offset) {
        const sequence = findings.filter(isVisible);
        const index = sequence.indexOf(current);
        const next = index === -1 ? sequence.at(offset > 0 ? 0 : -1) : sequence[index + offset];
        if (next) select(next);
      }

      function openPanel(finding) {
        setCurrent(finding);
        renderPanel();
        if (!panel.open) panel.showModal();
        writeHash();
      }

      function renderPanel() {
        const sequence = findings.filter(isVisible);
        const index = sequence.indexOf(current);
        const isPicked = picked.has(identity(current));
        $("panel-group").textContent = `Finding ${current.n} · ${levelOf[current.severity].label}`;
        $("panel-title").textContent = current.title;
        $("panel-note").textContent = current.evidence;
        $("panel-count").textContent = `${index + 1} of ${sequence.length}`;

        const rows = [
          ["Rules", current.rules],
          ["Skills", current.skills.map(skillName)],
          ["Locations", current.locations.map(place)],
        ];
        const detail = (label, value, stacked) =>
          h(
            "div",
            stacked ? { class: "detail", "data-stacked": "" } : { class: "detail" },
            h("dt", {}, label),
            h("dd", {}, ...[value].flat().map((part) => h("span", {}, part))),
          );
        $("panel-details").replaceChildren(
          ...rows.map(([label, value]) => detail(label, value)),
          detail("Fix", current.fix, true),
        );

        const pick = $("panel-pick");
        const label = isPicked ? "Unpick" : "Pick";
        pick.setAttribute("aria-pressed", String(isPicked));
        pick.setAttribute("aria-label", label);
        pick.title = `${label} (P)`;
        $("panel-prev").disabled = index <= 0;
        $("panel-next").disabled = index === sequence.length - 1;
      }

      $("panel-pick").innerHTML = check;
      $("panel-pick").addEventListener("click", () => togglePick(current));
      $("panel-prev").addEventListener("click", () => step(-1));
      $("panel-next").addEventListener("click", () => step(1));
      $("panel-close").addEventListener("click", () => panel.close());
      panel.addEventListener("click", (event) => {
        if (event.target !== panel) return;
        const rect = panel.getBoundingClientRect();
        const inside =
          event.clientX >= rect.left && event.clientX <= rect.right && event.clientY >= rect.top && event.clientY <= rect.bottom;
        if (!inside) panel.close();
      });
      panel.addEventListener("close", () => {
        writeHash();
        current?.open.focus({ preventScroll: true });
        current?.node.scrollIntoView({ block: "nearest" });
      });

      document.addEventListener("keydown", (event) => {
        if (event.metaKey || event.ctrlKey || event.altKey) return;
        if (event.key === "Escape" && panel.open) {
          event.preventDefault();
          panel.close();
          return;
        }
        if (event.target.closest("input, textarea, select, [contenteditable]")) return;
        if (event.shiftKey) {
          if (event.code !== "KeyC" || panel.open) return;
          event.preventDefault();
          copyPicks();
          return;
        }
        const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
        if (key === "j" || key === "ArrowDown" || key === "ArrowRight") step(1);
        else if (key === "k" || key === "ArrowUp" || key === "ArrowLeft") step(-1);
        else if (key === "p" && current) togglePick(current);
        else return;
        event.preventDefault();
      });

      function writeHash() {
        const params = new URLSearchParams();
        if (filters.severity) params.set("severity", filters.severity);
        if (filters.skill) params.set("skill", filters.skill);
        if (panel.open && current) params.set("finding", String(current.n));
        const hash = params.toString();
        history.replaceState(null, "", hash ? `#${hash}` : location.pathname + location.search);
      }

      function readHash() {
        const params = new URLSearchParams(location.hash.slice(1));
        const severity = params.get("severity");
        const skill = params.get("skill");
        filters.severity = levelOf[severity] ? severity : null;
        filters.skill = owners.includes(skill) ? skill : null;
        $("severity-filter").value = filters.severity ?? "";
        $("skill-filter").value = filters.skill ?? "";
        return findings.find((finding) => String(finding.n) === params.get("finding") && isVisible(finding));
      }

      const opened = readHash();
      render();
      renderCopy();
      if (opened) openPanel(opened);
    </script>
  </body>
</html>
