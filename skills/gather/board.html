        pick.setAttribute("aria-pressed", String(isPicked));
        pick.setAttribute("aria-label", label);
        pick.title = `${label} (P)`;
        $("viewer-prev").disabled = index <= 0;
        $("viewer-next").disabled = index === sequence.length - 1;
      }

      function step(offset) {
        const next = sequence[sequence.indexOf(current) + offset];
        if (!next) return;
        current = next;
        renderViewer();
        writeHash();
      }

      $("viewer-notes").addEventListener("input", (event) => {
        if (event.target.value.trim()) notes[current.url] = event.target.value.trim();
        else delete notes[current.url];
        localStorage.setItem(`${storageKey}:notes`, JSON.stringify(notes));
      });
      $("viewer-more").addEventListener("click", (event) => moreLikeThis(current, event.currentTarget));
      $("viewer-prev").addEventListener("click", () => step(-1));
      $("viewer-next").addEventListener("click", () => step(1));
      $("viewer-pick").addEventListener("click", () => togglePick(current));
      $("viewer-close").addEventListener("click", closeViewer);
      $("stage").addEventListener("click", (event) => {
        if (event.target === event.currentTarget) closeViewer();
      });
      viewer.addEventListener("cancel", (event) => {
        event.preventDefault();
        closeViewer();
      });

      viewer.addEventListener("close", () => {
        $("stage").replaceChildren();
        staged = null;
        if (filters.pickedOnly) layout();
        writeHash();
        if (!current) return;
        const target = focusNear(current, { preventScroll: true });
        target?.shot.scrollIntoView({ block: "nearest", behavior: motion.matches ? "smooth" : "auto" });
      });

      const compare = $("compare-dialog");

      function openCompare() {
        const picks = pickedItems();
        if (picks.length < 2) return;
        $("compare-count").textContent = String(picks.length);
        $("compare-row").style.setProperty("--n", String(Math.min(4, picks.length)));
        $("compare-row").replaceChildren(
          ...picks.map((item) => {
            const link = h("a", { href: item.url, target: "_blank", rel: "noreferrer", html: icons.external });
            link.prepend(item.title);
            return h(
              "figure",
              { class: "compare-item" },
              h("div", { class: "compare-media" }, mediaFor(item, { controls: true })),
              h(
                "figcaption",
                { class: "compare-caption" },
                link,
                h("span", { class: "compare-source" }, `${item.source} · ${item.group}`),
                item.note ? h("p", { class: "compare-note" }, item.note) : null,
                notes[item.url] ? h("p", { class: "compare-mine" }, notes[item.url]) : null,
              ),
            );
          }),
        );
        compare.showModal();
      }

      $("compare").addEventListener("click", openCompare);
      $("compare-close").addEventListener("click", () => compare.close());
      compare.addEventListener("close", () => $("compare-row").replaceChildren());

      document.addEventListener("keydown", (event) => {
        if (event.metaKey || event.ctrlKey || event.altKey || compare.open) return;
        if (event.key === "Escape" && viewer.open) {
          event.preventDefault();
          closeViewer();
          return;
        }
        if (event.target.closest("input, textarea, select, [contenteditable]")) return;
        if (event.shiftKey) {
          if (viewer.open) return;
          if (event.code === "KeyC") copyPicks($("copy"));
          else if (event.code === "KeyS") savePicks($("save"));
          else return;
          event.preventDefault();
          return;
        }
        const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
        if (viewer.open) {
          if (key === "j" || key === "ArrowDown" || key === "ArrowRight") step(1);
          else if (key === "k" || key === "ArrowUp" || key === "ArrowLeft") step(-1);
          else if (key === "p") togglePick(current);
          else if (key === "m") moreLikeThis(current, $("viewer-more"));
          else if (key === "o") window.open(current.url, "_blank", "noreferrer");
          else return;
        } else if (key === "c") {
          if ($("compare").disabled) return;
          openCompare();
        } else {
          const item = items.find((item) => item.node.contains(event.target));
          if (!item) return;
          if (key === "p") togglePick(item);
          else if (key === "m") moreLikeThis(item, item.shot);
          else if (key === "o") window.open(item.url, "_blank", "noreferrer");
          else return;
        }
        event.preventDefault();
      });

      function writeHash() {
        const params = new URLSearchParams();
        if (filters.source !== null) params.set("source", filters.source);
        if (filters.pickedOnly) params.set("picked", "1");
        if (viewer.open && current) params.set("item", current.url);
        const hash = params.toString();
        history.replaceState(null, "", hash ? `#${hash}` : location.pathname + location.search);
      }

      function readHash() {
        const params = new URLSearchParams(location.hash.slice(1));
        filters.source = sources.includes(params.get("source")) ? params.get("source") : null;
        filters.pickedOnly = params.get("picked") === "1";
        return items.find((item) => item.url === params.get("item") && isVisible(item));
      }

      ingest(board);
      const opened = readHash();
      renderFilters();
      renderPicks();
      layout();
      if (opened) openViewer(opened);
      poll();
    </script>
  </body>
</html>
